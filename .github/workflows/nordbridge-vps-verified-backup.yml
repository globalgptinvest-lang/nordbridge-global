name: NordBridge daily dual PostgreSQL restore verified backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-verified-backup.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-verified-backup
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess
          from pathlib import Path
          os.umask(0o077)
          root=Path('/opt/nordbridge-director')
          backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('nightly-config-%Y%m%dT%H%M%SZ');backup.mkdir(mode=0o700)
          service=Path('/etc/systemd/system/nordbridge-recovery-backup.service')
          shutil.copy2(service,backup/service.name)
          (root/'maintenance.py').write_bytes(base64.b64decode(''));(root/'maintenance.py').chmod(0o600)
          drop=Path('/etc/systemd/system/nordbridge-recovery-backup.service.d');drop.mkdir(exist_ok=True)
          (drop/'both-postgres.conf').write_text('[Service]\nExecStart=\nExecStart=/usr/bin/python3 /opt/nordbridge-director/maintenance.py\nTimeoutStartSec=45min\n')
          subprocess.run(['systemctl','daemon-reload'],check=True,capture_output=True)
          subprocess.run(['systemctl','enable','--now','nordbridge-recovery-backup.timer'],check=True,capture_output=True)
          p=subprocess.run(['python3',str(root/'maintenance.py')],capture_output=True,text=True,timeout=1800)
          print('NIGHTLY_BACKUP_EXIT='+str(p.returncode))
          for line in p.stdout.splitlines():
           try:
            x=json.loads(line)
            print('BACKUP_RESTORE_RESULT='+json.dumps(x))
           except:pass
          if p.returncode:raise RuntimeError('verified_backup_failed')
          print('BACKUP_TIMER_ACTIVE='+subprocess.run(['systemctl','is-active','nordbridge-recovery-backup.timer'],capture_output=True,text=True,check=True).stdout.strip())
          NB_REMOTE_PAYLOAD
