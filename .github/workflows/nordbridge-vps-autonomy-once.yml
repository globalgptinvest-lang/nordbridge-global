name: NordBridge one-time autonomous controller run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-autonomy-once.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-autonomy-once
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64, hashlib, json, subprocess, tempfile, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/globalgptinvest-lang/nordbridge-global/contents/ops/nordbridge-full-autonomy.sh?ref=d3fc43416cbc0776b01ad5f695bb32709dc77161'
          request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'NordBridge-ops'})
          with urllib.request.urlopen(request, timeout=25) as response:
              payload = json.loads(response.read(200000))
          script = base64.b64decode(payload['content'])
          expected = 'ad3878d5bebe149fc2a468e13a72021ad91820ff9d2d72951586cc9c31d29e26'
          assert hashlib.sha256(script).hexdigest() == expected, 'controller_checksum_mismatch'
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'nordbridge-full-autonomy.sh'
              path.write_bytes(script)
              path.chmod(0o750)
              check = subprocess.run(['bash', '-n', str(path)], capture_output=True, text=True, timeout=30)
              assert check.returncode == 0, 'controller_shell_syntax_failed'
              result = subprocess.run(['bash', str(path), '--full'], capture_output=True, text=True, timeout=900)
              for line in result.stdout.splitlines():
                  if line.startswith(('NORDBRIDGE_AUTONOMY_', 'DOCKER=', 'CONTAINERS=', 'DIRECTOR_MONITOR=', 'WEBSITE_INTAKE=', 'BACKUP=', 'AUTONOMY_TIMER=')):
                      print(line)
              if result.returncode:
                  raise SystemExit(result.returncode)
          print('AUTONOMY_RUN=PASS')
          NB_REMOTE_PAYLOAD
