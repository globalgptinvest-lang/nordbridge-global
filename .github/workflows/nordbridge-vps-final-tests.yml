name: NordBridge end to end recovery verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-final-tests.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-final-tests
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,subprocess,time
          from pathlib import Path
          exec(base64.b64decode('').decode().split("if __name__=='__main__':main()")[0])
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          out['crm']=inside('nordbridge-crm-api-1',CRM_TEST)
          out['public']=inside('nordbridge-office-core-1',PUBLIC_TEST,240)
          out['browser']=inside('nordbridge-office-core-1',BROWSER_TEST,300)
          owner=Path('/root/nordbridge-director-owner.txt').read_text().split('Password: ',1)[1].strip()
          LOGIN=r'''
          import json,httpx
          base='https://office.57.129.182.200.sslip.io'
          with httpx.Client(timeout=30,trust_env=False) as c:
           login=c.post(base+'/api/login',json={'password':OWNER},headers={'Origin':base})
           login.raise_for_status()
           good=c.get(base+'/api/tasks');bad=c.post(base+'/api/tasks',json={'task':'negative CSRF test','fingerprint':'negative-csrf'})
           internal=c.post(base+'/internal/tasks',json={})
           print(json.dumps({'login_http':login.status_code,'authenticated_read_http':good.status_code,'csrf_rejected':bad.status_code==403,'internal_route_hidden':internal.status_code==404,'secure_cookie':'; Secure' in login.headers.get('set-cookie',''),'httponly_cookie':'HttpOnly' in login.headers.get('set-cookie','')}))
          '''
          out['owner_login']=inside('nordbridge-director-director-1','OWNER='+repr(owner)+'\n'+LOGIN,90)
          CHAT=r'''
          import asyncio,json
          from playwright.async_api import async_playwright
          async def main():
           async with async_playwright() as p:
            b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=await b.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            r=await page.goto('https://office.57.129.182.200.sslip.io/',wait_until='domcontentloaded',timeout=30000)
            await page.locator('#password').fill(OWNER);await page.locator('#login button').click()
            await page.locator('#office').wait_for(state='visible',timeout=20000)
            await page.locator('#role').select_option('crm');await page.locator('#task').fill('Internal browser test: count CRM records; no external action.')
            async with page.expect_response(lambda r:'/api/tasks' in r.url and r.request.method=='POST') as posted:
             await page.locator('#taskform button').click()
            receipt=(await posted.value).status
            overflow=await page.evaluate('document.documentElement.scrollWidth>innerWidth+2')
            print(json.dumps({'mobile_chat_http':r.status,'login_visible_office':True,'task_post_http':receipt,'horizontal_overflow':overflow}))
            await b.close()
          asyncio.run(main())
          '''
          out['chat_browser']=inside('nordbridge-office-core-1','OWNER='+repr(owner)+'\n'+CHAT,100)
          # Seed a controlled expired lease and persisted checkpoint, then restart only the Director.
          SEED=r'''
          import director as d,json,uuid
          from psycopg.types.json import Jsonb
          t=d.Task(role='crm',stream='TEST',task='Controlled restart recovery test with saved checkpoint',fingerprint='RECOVERY-'+str(uuid.uuid4()))
          with d.db() as c:
           key=uuid.uuid4()
           c.execute("INSERT INTO director.jobs(id,role,stream,task,fingerprint,status,attempts,lease_until,lease_token) VALUES(%s,'crm','TEST',%s,%s,'RUNNING',1,now()+interval '3 seconds','controlled-test')",(key,t.task,t.fingerprint))
           c.execute('INSERT INTO director.steps(job_id,name,data) VALUES(%s,%s,%s)',(key,'crm_snapshot',Jsonb({'checkpoint':'persisted_before_restart','synthetic':True})))
          print(json.dumps({'job_id':str(key)}))
          '''
          seed=inside('nordbridge-director-director-1',SEED)
          r=subprocess.run(['docker','restart','nordbridge-director-director-1'],capture_output=True,text=True,timeout=60)
          time.sleep(12)
          RECOVER=r'''
          import director as d,json
          with d.db() as c:
           r=c.execute('SELECT status,attempts,result FROM director.jobs WHERE id=%s',(JOB,)).fetchone()
           n=c.execute('SELECT count(*) n FROM director.steps WHERE job_id=%s',(JOB,)).fetchone()['n']
           old=c.execute("SELECT count(*) n FROM director.jobs WHERE role='self_test' AND status='DONE'").fetchone()['n']
          print(json.dumps({'status':r['status'],'attempts':r['attempts'],'checkpoint_preserved':r['result'].get('snapshot',{}).get('checkpoint')=='persisted_before_restart','step_count':n,'previous_self_tests_retained':old}))
          '''
          out['restart_recovery']=inside('nordbridge-director-director-1','JOB='+repr(seed.get('job_id'))+'\n'+RECOVER)
          out['monitor']=run(['python3','/opt/nordbridge-director/monitor.py'])
          SUMMARY=r'''
          import director as d,json
          with d.db() as c:
           jobs=c.execute('SELECT role,status,count(*) n FROM director.jobs GROUP BY role,status ORDER BY role,status').fetchall()
           tenders=c.execute('SELECT count(*) n FROM director.tenders').fetchone()['n']
           audits=c.execute('SELECT count(*) n FROM director.audit').fetchone()['n']
           schedules=c.execute('SELECT role,count(*) n,max(created_at)::text last_run FROM director.schedule_runs GROUP BY role').fetchall()
           result=d.tender_import({'stream':'NORDBRIDGE'})
          print(json.dumps({'jobs':jobs,'tenders':tenders,'audit_rows':audits,'schedules':schedules,'repeated_tender_import':result},default=str))
          '''
          out['director_summary']=inside('nordbridge-director-director-1',SUMMARY)
          path=Path('/var/backups/nordbridge-director/final-tests.json');path.write_text(json.dumps(out,indent=2));path.chmod(0o600)
          print('FINAL_TEST_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
