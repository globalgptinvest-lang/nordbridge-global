# Legacy Airtable intake retired. The NordBridge deal registry is monday.com.
# This workflow is manual-only until a verified monday.com integration is implemented.
name: NordBridge CRM intake (legacy disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy integration
        run: |
          echo "Legacy Airtable CRM intake is disabled. NordBridge uses monday.com Deal Registry." >> "$GITHUB_STEP_SUMMARY"
          echo "No Gmail data was read, and no CRM records were created by this workflow." >> "$GITHUB_STEP_SUMMARY"
