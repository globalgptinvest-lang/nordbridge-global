name: NordBridge encrypted configuration discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-private-discovery.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-private-discovery
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import os,json,subprocess,base64,tempfile,gzip
          from pathlib import Path
          CERT='-----BEGIN CERTIFICATE-----\nMIIELzCCApegAwIBAgIUHhSm8HjnZwCqydSZJd+vcCeLfwowDQYJKoZIhvcNAQEL\nBQAwJzElMCMGA1UEAwwcbm9yZGJyaWRnZS1zZXNzaW9uLWRpc2NvdmVyeTAeFw0y\nNjEwMjUyMTEyMzdaFw0yNjEwMjYyMTEyMzdaMCcxJTAjBgNVBAMMHG5vcmRicmlk\nZ2Utc2Vzc2lvbi1kaXNjb3ZlcnkwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK\nAoIBgQCsPFPIzWoQEqjYfziH8H4S1t/0x1HtrCK2ILaNTqCpqDQ86Mc1jjjNe50J\n/Mg7YK2b6QxAcYZPhipj0XAEPnA7OgQLqNZnke+f6guLWmzs9kogoA4eXHXgr3R1\niFuwrGFznVlooLzoEQPq/JpjUXQpwp8w6sV9pmlorY4sgqolsgn1ZREZ326ebOEK\n8NhCO3MHAqoYNJR9gfG+3dp2yKqJHPQpP4cw4pDSnz1vQPntOVHQUSuT8IVuwM/I\nsf8CmNMMehWFf7+etsuUaL+hxosE7eLTFvef4WdamRDCSYosjcUc2HhH8NejF9LS\nV4sDbXHeFbTxP6YqCDvPW+MSSw1RSd0i7imMt0gnOHlUtW6l/PhkUY5KQ8xMcpQf\ngND4LfCBhDkowuwJzTZf5vCXVVat5WEz4/xhl01PaO7fOjDaN9XwAA8ybKTkc+up\nVxP5JOZJK9EVQkZgRmcmsmFu6XOL65rJPBXrIAPlB5am1hPLXgpPZ8rokTri2DxC\nX380qm8CAwEAAaNTMFEwHQYDVR0OBBYEFPJxZi8lUR6S/xympnabzrX2qOsVMB8G\nA1UdIwQYMBaAFPJxZi8lUR6S/xympnabzrX2qOsVMA8GA1UdEwEB/wQFMAMBAf8w\nDQYJKoZIhvcNAQELBQADggGBAGT6Un12+9/5XEtgsORXO/Khb6h3Q1atv77Z8yK3\nycrvPgHSRy/t8dfaLgOo4W6n1BHKhBV8Atxwf4JlvZJ2WWtgJUuXLHQwGPykvZMY\nQmnxMn4Nb4MmCXpTortx4EyOqWtBX/YZc1swIOqR/4DJCTf4DUVSV3ljuTZSO0Gj\nTQM/qetGrZIvHegs5mBL1AoQJWFkxsZKNPQLmfpdsZzry7IFd5yY1b+dJSF0dGbt\n5RG2bjl3wolrQaBn+Ue7AfnIA2c1G96GEw8os0XGZyRHRTCf8cD+To0QOeuyVuHg\nNbsua0/7oM2cO+iiL8WfECaZfVC3ofDYXiMfBA0w0MlNSzPscwH20ZwD8OJbf7eq\n0ZOioRmcTRk0cUTgxPDV/fWT6XmAi1Iqif/YBUNGSqPBpBrz1+Zj4M+lQn26iwGg\naXNS5k4OqbTbR+jswAVCOjhw/tiNFjyh4QG4PLHdo+6ci0ng/sbm6sljzIZvBh5g\nlJ0jCBN8f/43OjZ432U1PxIX/A==\n-----END CERTIFICATE-----\n'
          os.umask(0o077)
          def cmd(args,input=None):
           r=subprocess.run(args,input=input,capture_output=True,text=True,timeout=45)
           return r.stdout if r.returncode==0 else ''
          ids=cmd(['docker','ps','-aq']).splitlines()
          cs=json.loads(cmd(['docker','inspect']+ids));packet={'containers':[],'files':{},'databases':[],'n8n_workflows':[]}
          roots=set();budget=0
          for c in cs:
           env=dict(s.split('=',1) for s in c['Config'].get('Env',[]) if '=' in s)
           safeenv={k:v for k,v in env.items() if k in ['N8N_HOST','N8N_PORT','N8N_PROTOCOL','WEBHOOK_URL','EXECUTIONS_MODE','DB_TYPE']}
           meta={k:c.get(k) for k in ['Id','Name','Image','Mounts','NetworkSettings']}
           meta['config']={k:c['Config'].get(k) for k in ['Image','Cmd','Entrypoint','WorkingDir','Labels','ExposedPorts']};meta['env_keys']=sorted(env);meta['public_config']=safeenv
           packet['containers'].append(meta)
           for p in (c['Config'].get('Labels') or {}).get('com.docker.compose.project.config_files','').split(','):
            if p and Path(p).is_file():roots.add(Path(p).parent)
           for m in c.get('Mounts',[]):
            if m.get('Type')=='bind' and Path(m['Source']).is_dir() and Path(m['Source']).parts[:2] in [('/','opt'),('/','home'),('/','root')]:roots.add(Path(m['Source']))
           if 'postgres' in c['Config']['Image'].lower():
            query="SELECT coalesce(json_agg(datname),'[]') FROM pg_database WHERE NOT datistemplate;"
            prefix=['docker','exec','-i',c['Id'],'sh','-c','exec psql -X -A -t -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d postgres']
            try:dbs=json.loads(cmd(prefix,query))
            except ValueError:continue
            for db in dbs:
             prefix=['docker','exec','-i','-e','NB_AUDIT_DB='+db,c['Id'],'sh','-c','exec psql -X -A -t -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d "$NB_AUDIT_DB"']
             schemas=cmd(prefix,"SELECT coalesce(json_agg(x),'[]') FROM (SELECT table_schema,table_name,column_name,data_type FROM information_schema.columns WHERE table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema,table_name,ordinal_position) x;")
             try:columns=json.loads(schemas)
             except ValueError:continue
             packet['databases'].append({'container':c['Name'],'database':db,'columns':columns})
             if any(x['table_name']=='workflow_entity' for x in columns):
              workflows=cmd(prefix,"SELECT coalesce(json_agg(x),'[]') FROM (SELECT id,name,active,nodes,connections,settings FROM workflow_entity) x;")
              try:packet['n8n_workflows']+=json.loads(workflows)
              except ValueError:pass
           if any(x in c['Name'].lower() for x in ['core','crm']):
            probe="""import os,json,pathlib
          out={};total=0
          for root,dirs,files in os.walk('/app'):
           dirs[:]=[d for d in dirs if d not in ['node_modules','.git','__pycache__','.venv','venv','data','logs'] and len(pathlib.Path(root).parts)<6]
           for f in files:
            p=pathlib.Path(root)/f
            if p.suffix not in ['.py','.js','.ts','.toml','.yml','.yaml'] and f not in ['Dockerfile','requirements.txt','package.json']:continue
            if p.stat().st_size>200000 or total>3000000:continue
            try:s=p.read_text();out[str(p)]=s;total+=len(s)
            except Exception:pass
          print(json.dumps(out))"""
            data=cmd(['docker','exec',c['Id'],'python3','-c',probe])
            try:
             for k,v in json.loads(data).items():packet['files'][c['Name']+':'+k]=v
            except ValueError:pass
          for p in ['/root/nordbridge-mail','/opt/nordbridge-mail-agent','/usr/local/libexec','/opt/nordbridge-office','/home/ubuntu/nordbridge_server_crm']:
           if Path(p).is_dir():roots.add(Path(p))
          for root in roots:
           for folder,dirs,files in os.walk(root):
            dirs[:]=[d for d in dirs if d not in ['.git','node_modules','__pycache__','.venv','venv','data','logs','backups','pgdata','postgres','qdrant','models','storage'] and len(Path(folder).relative_to(root).parts)<4]
            for f in files:
             p=Path(folder)/f
             if root == Path('/usr/local/libexec') and not any(t in p.name for t in ['nordbridge','nb_','nb-']):continue
             if p.suffix not in ['.py','.sh','.js','.ts','.yml','.yaml','.toml'] and f not in ['Dockerfile','requirements.txt','package.json','Caddyfile']:continue
             if p.is_symlink() or p.stat().st_size>200000 or budget>4000000:continue
             try:s=p.read_text();packet['files'][str(p)]=s;budget+=len(s)
             except Exception:pass
          for p in Path('/etc/systemd/system').glob('*nordbridge*'):
           if p.is_file() and not p.is_symlink():packet['files'][str(p)]=p.read_text()
          for p in ['/root/nordbridge-office-agent.json']:
           if Path(p).is_file():packet['files'][p]=Path(p).read_text()
          # Encrypt the packet to a task-only certificate. Public logs contain ciphertext only.
          with tempfile.TemporaryDirectory() as d:
           p=Path(d);(p/'cert.pem').write_text(CERT)
           payload=gzip.compress(json.dumps(packet).encode());(p/'input.gz').write_bytes(payload)
           r=subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-in',str(p/'input.gz'),'-out',str(p/'packet.der'),'-outform','DER',str(p/'cert.pem')],capture_output=True,timeout=30)
           if r.returncode:raise RuntimeError('encrypted_transfer_failed')
           text=base64.b64encode((p/'packet.der').read_bytes()).decode()
           for index in range(0,len(text),2000):print('NB_ENCRYPTED_DISCOVERY_'+str(index//2000).zfill(5)+'='+text[index:index+2000])
          print('DISCOVERY_ENCRYPTED=COMPLETE')
          NB_REMOTE_PAYLOAD
