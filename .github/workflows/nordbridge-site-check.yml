name: NordBridge site health check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site and key pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /contact.html /privacy.html; do
            url="https://nordbridge-global.com${path}"
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$url")"
            echo "$url HTTP $code"
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Site health failure: $url HTTP $code"
              exit 1
            fi
          done
