name: NordBridge controlled VPS reboot and persistence proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-reboot-proof.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-reboot-proof
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import datetime,json,os,subprocess,time
          from pathlib import Path
          os.umask(0o077)
          marker=Path('/var/lib/nordbridge-reboot-proof.json')
          boot=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
          if marker.exists():
           old=json.loads(marker.read_text())
           if old.get('state')=='PASS' or old.get('before_boot')!=boot:
            print('REBOOT_ALREADY_REQUESTED_OR_PROVEN');raise SystemExit(0)
           raise RuntimeError('reboot_request_already_pending_no_duplicate')
          for attempt in range(20):
           p=subprocess.run(['docker','exec','nordbridge-director-director-1','python3','-c',"import director as d;c=d.db();print(c.execute(\"SELECT count(*) n FROM director.jobs WHERE status IN ('QUEUED','RUNNING')\").fetchone()['n']);c.close()"],text=True,capture_output=True,timeout=20)
           if p.returncode==0 and p.stdout.strip()=='0':break
           time.sleep(5)
          else:raise RuntimeError('pending_director_jobs_reboot_postponed')
          # Both logical databases and application evidence must restore before a VPS reboot.
          p=subprocess.run(['python3','/opt/nordbridge-director/maintenance.py'],text=True,capture_output=True,timeout=1800)
          if p.returncode:raise RuntimeError('pre_reboot_verified_backup_failed')
          reports=[json.loads(line) for line in p.stdout.splitlines() if line.startswith('{')]
          report=reports[-1]
          if len(report.get('postgres',[]))!=2 or any(x['restore']['status']!='WORKING' for x in report['postgres']):raise RuntimeError('pre_reboot_restore_not_proven')
          data={'state':'REQUESTED','before_boot':boot,'backup_directory':report['backup_directory'],'requested_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          marker.write_text(json.dumps(data));marker.chmod(0o600)
          subprocess.run(['systemd-run','--unit=nordbridge-controlled-reboot','--on-active=15s','/usr/sbin/reboot'],check=True,capture_output=True)
          print('REBOOT_PREFLIGHT='+json.dumps(data),flush=True)
          NB_REMOTE_PAYLOAD
          sleep 25
          ready=0
          for attempt in $(seq 1 18); do
            if ssh -F /dev/null -T -i "$ssh_dir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ConnectTimeout=5 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
              -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_AFTER_REBOOT'
          import datetime,json,subprocess,sys,urllib.request
          from pathlib import Path
          marker=Path('/var/lib/nordbridge-reboot-proof.json');p=json.loads(marker.read_text())
          boot=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
          if boot==p['before_boot']:raise SystemExit(2)
          try:
           ids=subprocess.check_output(['docker','ps','-q'],text=True).split()
           cs=json.loads(subprocess.check_output(['docker','inspect']+ids,text=True))
           expected={'nordbridge-director-director-1','nordbridge-office-caddy-1','nordbridge-crm-api-1','nordbridge-crm-db-1','nordbridge-office-core-1','nordbridge-office-n8n-1','nordbridge-office-worker-1','nordbridge-office-postgres-1','nordbridge-office-redis-1','nordbridge-office-qdrant-1','nordbridge-office-ollama-1'}
           if not expected.issubset({c['Name'].lstrip('/') for c in cs}):raise RuntimeError('containers_not_all_started')
           if any(c['State'].get('Health',{}).get('Status') not in (None,'healthy') for c in cs):raise RuntimeError('container_health_pending')
           for u in ['https://office.57.129.182.200.sslip.io/health','https://crm.57.129.182.200.sslip.io/health','https://n8n.57.129.182.200.sslip.io/','https://nordbridge-global.com/']:
            with urllib.request.urlopen(u,timeout=10) as r:
             if r.status!=200:raise RuntimeError('https_not_ready')
           for unit in ['docker','nordbridge-director-monitor.timer','nordbridge-ted-connector.timer','nordbridge-recovery-backup.timer','nordbridge-mail-agent.timer']:
            subprocess.run(['systemctl','is-active','--quiet',unit],check=True,timeout=10)
           sql="SELECT json_build_object('director_test_result',(SELECT count(*) FROM director.jobs WHERE role='self_test' AND status='DONE'),'synthetic_company',(SELECT count(*) FROM director.companies WHERE stream='TEST'),'product_proposal',(SELECT count(*) FROM director.proposals WHERE data->>'kind'='product_research'));"
           check=subprocess.run(['docker','exec','-i','nordbridge-crm-db-1','sh','-c','exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At'],input=sql,text=True,capture_output=True,check=True,timeout=30)
           evidence=json.loads(check.stdout)
           if evidence['director_test_result']<1 or evidence['synthetic_company']<1:raise RuntimeError('persisted_data_missing')
           ai=subprocess.run(['docker','exec','nordbridge-director-director-1','python3','-c',"import director as d,json;r=d.local_model('Reply with exactly these three words: NordBridge restart verified');print(json.dumps({'nonempty':bool(r.get('draft')),'model':r.get('model')}))"],capture_output=True,text=True,check=True,timeout=170)
           model=json.loads(ai.stdout)
           if not model['nonempty']:raise RuntimeError('model_inference_empty')
           p.update(ai_inference=model,state='PASS',after_boot=boot,verified_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),containers_running=len(cs),persisted_crm_evidence=evidence,https='PASS',timers='PASS',ssh='PASS')
           marker.write_text(json.dumps(p));marker.chmod(0o600)
           print('VPS_REBOOT_TEST='+json.dumps(p))
          except Exception as e:
           print('REBOOT_READINESS_PENDING='+type(e).__name__);raise SystemExit(3)
          NB_AFTER_REBOOT
            then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::VPS reboot readiness was not proven within the bounded verification window."
            exit 1
          fi
