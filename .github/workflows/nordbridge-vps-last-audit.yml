name: NordBridge final resource security and schedule audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-last-audit.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-last-audit
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess
          from pathlib import Path
          os.umask(0o077)
          root=Path('/opt/nordbridge-director');backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('final-monitor-%Y%m%dT%H%M%SZ');backup.mkdir(mode=0o700)
          shutil.copy2(root/'monitor.py',backup/'monitor.py')
          (root/'monitor.py').write_bytes(base64.b64decode(''));(root/'monitor.py').chmod(0o644)
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:return {'error':'exit_'+str(p.returncode)}
           try:return json.loads(p.stdout)
           except:return p.stdout.strip()
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          out['monitor']=run(['python3',str(root/'monitor.py')])
          out['daily_report_test']=run(['python3',str(root/'monitor.py'),'--send-daily-test'])
          sql='''SELECT coalesce(json_agg(x),'[]') FROM (SELECT w.name,w.active,e.status,e."startedAt",e."stoppedAt" FROM workflow_entity w LEFT JOIN LATERAL (SELECT status,"startedAt","stoppedAt" FROM execution_entity WHERE "workflowId"=w.id ORDER BY "startedAt" DESC LIMIT 1) e ON true ORDER BY w.name) x;'''
          out['n8n_workflows']=run(['docker','exec','-i','nordbridge-office-postgres-1','sh','-c','exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At'],sql)
          out['reboot']=json.loads(Path('/var/lib/nordbridge-reboot-proof.json').read_text())
          code="import director as d,json; c=d.db(); print(json.dumps({'jobs':c.execute('SELECT role,status,count(*) n FROM director.jobs GROUP BY role,status ORDER BY role,status').fetchall(),'schedules':c.execute('SELECT role,count(*) n,max(created_at)::text last FROM director.schedule_runs GROUP BY role').fetchall(),'tenders':c.execute('SELECT count(*) n FROM director.tenders').fetchone()['n'],'product_proposals':c.execute(\"SELECT count(*) n FROM director.proposals WHERE data->>'kind'='product_research'\").fetchone()['n'],'website_leads':c.execute('SELECT count(*) n FROM public.website_leads').fetchone()['n']},default=str));c.close()"
          out['director']=run(['docker','exec','nordbridge-director-director-1','python3','-c',code])
          out['timers']=run(['systemctl','list-timers','--all','--no-pager'])
          Path('/var/backups/nordbridge-director/final-state.json').write_text(json.dumps(out,indent=2))
          print('FINAL_STATE='+json.dumps(out))
          NB_REMOTE_PAYLOAD
