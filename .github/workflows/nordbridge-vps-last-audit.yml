name: NordBridge final resource security and schedule audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-last-audit.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-last-audit
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import datetime,json,subprocess,time,base64
          from pathlib import Path
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          def inside(name,code,timeout=120):
           p=subprocess.run(['docker','exec','-i',name,'python3','-'],input=code,text=True,capture_output=True,timeout=timeout)
           if p.returncode:return {'error':'exit_'+str(p.returncode)}
           try:return json.loads(p.stdout)
           except:return {'error':'invalid_response'}
          probe=base64.b64decode('').decode().replace('    await page.add_style_tag(content=CSS)\n','')
          out['production_layout']=inside('nordbridge-office-core-1',probe,240)
          status=r'''
          import director as d,json,httpx
          with d.db() as c:
           rows=c.execute("SELECT role,status,attempts,error,updated_at FROM director.jobs WHERE fingerprint LIKE 'ROLETEST-%' ORDER BY created_at").fetchall()
           counts=c.execute("SELECT role,status,count(*) n FROM director.jobs GROUP BY role,status ORDER BY role,status").fetchall()
           schedules=c.execute('SELECT role,count(*) n,max(created_at) last FROM director.schedule_runs GROUP BY role').fetchall()
           reports=[]
           for role in ['director','sales','legal','marketing']:
            x=c.execute("SELECT result FROM director.jobs WHERE role=%s AND fingerprint LIKE 'ROLETEST-%%' ORDER BY created_at DESC LIMIT 1",(role,)).fetchone()
            if x and x['result']:
             ai=x['result'].get('plan') or x['result'].get('draft') or {}
             reports.append({'role':role,'model':ai.get('model'),'output_tokens':ai.get('output_tokens'),'draft_nonempty':bool(ai.get('draft'))})
          with httpx.Client(timeout=20,follow_redirects=True,trust_env=False) as client:
           urls=['https://nordbridge-global.com/','https://office.57.129.182.200.sslip.io/','https://crm.57.129.182.200.sslip.io/health','http://core:8000/health','http://n8n:5678/healthz','http://ollama:11434/api/tags']
           checks={}
           for u in urls:
            try:r=client.get(u);checks[u]=r.status_code
            except Exception as e:checks[u]=type(e).__name__
           css=client.get('https://www.nordbridge-global.com/style.css?v=20261017menu1')
           out={'roles':rows,'counts':counts,'schedules':schedules,'model_drafts':reports,'health':checks,'production_stylesheet_contains_fix':'Keep translated hero text' in css.text}
           print(json.dumps(out,default=str))
          '''
          out['director']=inside('nordbridge-director-director-1',status,180)
          ids=subprocess.check_output(['docker','ps','-q'],text=True).split();cs=json.loads(subprocess.check_output(['docker','inspect']+ids,text=True))
          out['containers']=[{'name':c['Name'],'running':c['State']['Running'],'health':c['State'].get('Health',{}).get('Status'),'memory':c['HostConfig']['Memory'],'cpus':c['HostConfig']['NanoCpus']} for c in cs]
          out['ufw']=subprocess.check_output(['ufw','status'],text=True).splitlines()[0]
          out['monitor']=json.loads(Path('/var/lib/nordbridge-director-monitor.json').read_text())
          Path('/var/backups/nordbridge-director/acceptance.json').write_text(json.dumps(out,indent=2))
          print('ACCEPTANCE_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
