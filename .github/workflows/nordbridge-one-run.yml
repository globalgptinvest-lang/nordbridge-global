name: NordBridge ONE RUN — operations audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "automation/nordbridge_one_run.py"
      - "scripts/tests/test_one_run.py"
      - ".github/workflows/nordbridge-one-run.yml"
  push:
    branches: [main]
    paths:
      - "automation/nordbridge_one_run.py"
      - "scripts/tests/test_one_run.py"
      - ".github/workflows/nordbridge-one-run.yml"
permissions:
  contents: read
concurrency:
  group: nordbridge-one-run-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-run:
    name: Website + CRM readiness + tender scan + safety tests + payment-link inventory
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser checker (no paid SaaS)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Restore public tender dedupe state (no client info)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nordbridge-state.json
          key: public-monitor-${{ github.run_id }}
          restore-keys: |
            public-monitor-
      - name: Run all safe NordBridge checks and compile ONE report
        shell: bash
        run: |
          python3 automation/nordbridge_one_run.py \
            --browser \
            --state /tmp/nordbridge-state.json \
            --public-report /tmp/nordbridge-public-report.json \
            --output /tmp/nordbridge-one-run.json \
            --summary /tmp/nordbridge-one-run.md
      - name: Save public tender dedupe state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/nordbridge-state.json
          key: public-monitor-${{ github.run_id }}
      - name: Attach safe reports (public notice metadata only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordbridge-one-run-${{ github.run_id }}
          path: |
            /tmp/nordbridge-one-run.json
            /tmp/nordbridge-one-run.md
            /tmp/nordbridge-public-report.json
          retention-days: 3
          if-no-files-found: warn
