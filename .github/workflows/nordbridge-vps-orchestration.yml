name: NordBridge durable multi department Director recovery proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-orchestration.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-orchestration
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess,time
          from pathlib import Path
          FILES={'director.py': '', 'tick.py': ''}
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          os.umask(0o077);root=Path('/opt/nordbridge-director')
          backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('orchestration-%Y%m%dT%H%M%SZ');backup.mkdir(mode=0o700)
          run(['python3',str(root/'maintenance.py')],timeout=1800)
          for name,content in FILES.items():
           shutil.copy2(root/name,backup/name)
           (root/name).write_bytes(base64.b64decode(content));(root/name).chmod(0o644)
          run(['docker','compose','-p','nordbridge-director','-f',str(root/'compose.yaml'),'up','-d','--no-build','--force-recreate']);time.sleep(5)
          run(['python3',str(root/'monitor.py')])
          seed="import director as d,json,uuid; print(json.dumps(d.enqueue(d.Task(role='director',stream='TEST',task='Create a two-sentence plan and coordinate bounded read-only checks of CRM, public website, mailbox summary and application health. Never send externally.',fingerprint='ORCHESTRATION-'+str(uuid.uuid4())))))"
          receipt=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c',seed]));job=receipt['id']
          query="import director as d,json; c=d.db();r=c.execute('SELECT status,attempts,result,error FROM director.jobs WHERE id=%s',("+repr(job)+",)).fetchone();print(json.dumps(r,default=str));c.close()"
          phase=None
          for i in range(85):
           state=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c',query]))
           if state['status'] in ('WAITING','DONE','FAILED','BLOCKED'):phase=state['status'];break
           time.sleep(2)
          if phase in ('WAITING','DONE'):
           run(['docker','restart','nordbridge-director-director-1'],timeout=60);time.sleep(5)
          for i in range(90):
           try:state=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c',query]))
           except Exception:time.sleep(4);continue
           if state['status'] not in ('QUEUED','RUNNING','WAITING'):break
           time.sleep(4)
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'job_id':job,'restart_phase':phase,
               'parent_status':state['status'],'parent_error':state['error'],'children':state.get('result',{}).get('children',[]),
               'delegation':state.get('result',{}).get('delegation',{}),'stream':state.get('result',{}).get('snapshot',{}).get('stream'),
               'external_sent':0}
          Path('/var/backups/nordbridge-director/orchestration-proof.json').write_text(json.dumps(out,indent=2))
          print('ORCHESTRATION_PROOF='+json.dumps(out))
          if out['parent_status']!='DONE' or len(out['children'])!=4 or any(x['status']!='DONE' for x in out['children']):raise RuntimeError('orchestration_proof_incomplete')
          NB_REMOTE_PAYLOAD
