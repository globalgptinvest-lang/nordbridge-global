name: NordBridge VPS SSH access gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-access.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-access-gate
  cancel-in-progress: false
jobs:
  verify-access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify workagent SSH access without changing VPS
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          if ! result="$(ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -p 22 workagent@57.129.182.200 \
            'test "$(id -un)" = workagent && printf NORDBRIDGE_WORKAGENT_SSH_OK' 2>/dev/null)"; then
            echo "::error::FAILED: SSH connection, pinned host key, key authentication or workagent identity check failed."
            echo "VPS_SSH_ACCESS=FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$result" != "NORDBRIDGE_WORKAGENT_SSH_OK" ]]; then
            echo "::error::FAILED: unexpected response; no server output is published."
            exit 1
          fi
          echo "VPS_SSH_ACCESS=WORKING"
          echo "VPS_SSH_ACCESS=WORKING: authenticated as workagent; no server changes." >> "$GITHUB_STEP_SUMMARY"
