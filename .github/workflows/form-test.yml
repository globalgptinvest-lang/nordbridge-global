name: One-time NordBridge form test

on:
  push:
    branches: [main]

jobs:
  test-form:
    if: github.event.head_commit.message == 'One-time website form delivery test'
    runs-on: ubuntu-latest
    steps:
      - name: Submit test enquiry
        run: |
          curl --fail-with-body -sS -X POST 'https://formsubmit.co/ajax/info@nordbridge-global.com' \
            -H 'Accept: application/json' \
            -F 'Company=NordBridge Website Test' \
            -F 'Email=nordbridge.dk@gmail.com' \
            -F 'Tender link or reference=TEST-FORM-2026-09-21' \
            -F 'Deadline=2026-09-30' \
            -F 'Support required=Automated website form delivery test' \
            -F '_subject=NordBridge website form test' \
            -F '_template=table' \
            -F '_captcha=false'
