name: NordBridge verified backup readiness recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-maintenance.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-maintenance
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,hashlib,importlib.util,json,os,shutil,subprocess
          from pathlib import Path
          os.umask(0o077)
          root=Path('/opt/nordbridge-director');dest=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('backup-readiness-fix-%Y%m%dT%H%M%SZ');dest.mkdir(mode=0o700)
          for name,encoded in {'maintenance.py': '', 'monitor.py': ''}.items():
           shutil.copy2(root/name,dest/name)
           (root/name).write_bytes(base64.b64decode(encoded));(root/name).chmod(0o600 if name=='maintenance.py' else 0o644)
          spec=importlib.util.spec_from_file_location('maintenance',root/'maintenance.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          old=Path('/var/backups/nordbridge-maintenance/20261026T023004932631Z')
          hashes=json.loads((old/'checksums.json').read_text())
          ids=subprocess.check_output(['docker','ps','-aq'],text=True).split()
          containers=json.loads(subprocess.check_output(['docker','inspect']+ids,text=True))
          pgs=[c for c in containers if m.kind(c)=='postgres']
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'original_nightly_replay':[],'systemd_runs':[]}
          for i,c in enumerate(pgs,1):
           dump=old/('postgres-'+str(i)+'.sql')
           if hashlib.sha256(dump.read_bytes()).hexdigest()!=hashes[dump.name]:raise RuntimeError('nightly_backup_checksum_failed')
           result=m.restore_verify(c,dump,m.databases(c['Id']))
           out['original_nightly_replay'].append({'index':i,'checksum':'PASS','restore':result})
          print('NIGHTLY_REPLAY='+json.dumps(out['original_nightly_replay']),flush=True)
          for attempt in range(3):
           p=subprocess.run(['systemctl','start','nordbridge-recovery-backup.service'],capture_output=True,text=True,timeout=1800)
           latest=sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1]
           data=json.loads(latest.read_text())
           result={'attempt':attempt+1,'service_exit':p.returncode,'backup_directory':data['backup_directory'],'restores':[x['restore'] for x in data['postgres']]}
           out['systemd_runs'].append(result)
           print('SYSTEMD_RESTORE_REGRESSION='+json.dumps(result),flush=True)
           if p.returncode or len(result['restores'])!=2 or any(x['status']!='WORKING' for x in result['restores']):raise RuntimeError('systemd_restore_regression_failed')
          p=subprocess.run(['python3',str(root/'monitor.py')],capture_output=True,text=True,timeout=120)
          out['monitor']=json.loads(p.stdout) if p.returncode==0 else {'error':'monitor_failed'}
          out['service_state']=subprocess.check_output(['systemctl','show','nordbridge-recovery-backup.service','-p','Result','-p','ExecMainStatus'],text=True)
          out['time_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (dest/'result.json').write_text(json.dumps(out,indent=2))
          print('BACKUP_REPAIR_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
