name: NordBridge actual systemd restore failure diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-maintenance.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-maintenance
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,secrets,shutil,subprocess,time
          from pathlib import Path
          os.umask(0o077)
          root=Path('/opt/nordbridge-director');dest=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('backup-diagnostic-%Y%m%dT%H%M%SZ');dest.mkdir(mode=0o700)
          shutil.copy2(root/'maintenance.py',dest/'maintenance-before.py')
          (root/'maintenance.py').write_bytes(base64.b64decode(''));(root/'maintenance.py').chmod(0o600)
          p=subprocess.run(['systemctl','start','nordbridge-recovery-backup.service'],capture_output=True,text=True,timeout=1800)
          last=sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1]
          result=json.loads(last.read_text())
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'systemd_backup_exit':p.returncode,'backup_directory':result['backup_directory'],'postgres':result['postgres'],'startup_samples':[]}
          info=json.loads(subprocess.check_output(['docker','inspect','nordbridge-office-postgres-1'],text=True))[0]
          for attempt in range(3):
           name='nb-readiness-probe-'+secrets.token_hex(5);user='probe_'+secrets.token_hex(4)
           try:
            subprocess.run(['docker','run','-d','--name',name,'--network','none','--memory','768m','--cpus','1','--pids-limit','128','--tmpfs','/var/lib/postgresql/data:rw,nosuid,size=1g','-e','PGDATA=/var/lib/postgresql/data','-e','POSTGRES_HOST_AUTH_METHOD=trust','-e','POSTGRES_USER='+user,info['Image']],check=True,capture_output=True,timeout=60)
            for tick in range(180):
             unix=subprocess.run(['docker','exec',name,'pg_isready','-U',user],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5).returncode
             if unix==0:
              tcp=subprocess.run(['docker','exec',name,'pg_isready','-h','127.0.0.1','-U',user],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5).returncode
              proc=subprocess.check_output(['docker','exec',name,'readlink','/proc/1/exe'],text=True,timeout=5).strip().rsplit('/',1)[-1]
              out['startup_samples'].append({'unix_ready':True,'tcp_ready':tcp==0,'pid1_executable':proc});break
             time.sleep(.05)
           finally:
            subprocess.run(['docker','rm','-f','-v',name],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=60)
          print('BACKUP_DIAGNOSTIC='+json.dumps(out))
          NB_REMOTE_PAYLOAD
