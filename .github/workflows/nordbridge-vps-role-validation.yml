name: NordBridge bounded resources and real department validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-role-validation.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-role-validation
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess,time,re
          from pathlib import Path
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          os.umask(0o077)
          root=Path('/opt/nordbridge-director');backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('resources-%Y%m%dT%H%M%SZ');backup.mkdir(mode=0o700)
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
           import yaml
           source=Path('/opt/nordbridge-office/docker-compose.yml');old=source.read_text();shutil.copy2(source,backup/'docker-compose.yml')
           cfg=yaml.safe_load(old)
           caps={'core':'1g','n8n':'1g','worker':'1g','postgres':'1g','redis':'256m','qdrant':'512m','caddy':'128m','ollama':'9g'}
           for name,cap in caps.items():
            svc=cfg['services'][name];svc['mem_limit']=cap
            svc['logging']={'driver':'json-file','options':{'max-size':'5m','max-file':'3'}}
            if name=='ollama':svc['cpus']=3;svc['memswap_limit']='11g'
           source.write_text(yaml.safe_dump(cfg,sort_keys=False));source.chmod(0o600)
           try:run(['docker','compose','-f',str(source),'config','--quiet'])
           except:source.write_text(old);raise
           applied=[]
           for name,cap in caps.items():
            container='nordbridge-office-'+name+'-1'
            stats=json.loads(run(['docker','stats','--no-stream','--format','{{json .}}',container]))
            usage=stats['MemUsage'].split('/')[0].strip();m=re.match(r'([\d.]+)\s*([KMG]i?B|B)',usage)
            units={'B':1,'kB':1000,'KB':1000,'KiB':1024,'MB':1000**2,'MiB':1024**2,'GB':1000**3,'GiB':1024**3}
            used=float(m[1])*units[m[2]] if m else None
            limit=int(cap[:-1])*({'g':1024**3,'m':1024**2}[cap[-1]])
            if used is None or used>limit*0.75:
             applied.append({'service':name,'runtime_limit':'SKIPPED_CURRENT_USAGE','compose_limit':cap});continue
            args=['docker','update','--memory',cap,'--memory-swap','11g' if name=='ollama' else str(limit*2)]
            if name=='ollama':args+=['--cpus','3']
            run(args+[container]);applied.append({'service':name,'runtime_limit':cap})
           out['resources']=applied;out['log_rotation']='Configured for next service recreation; existing Director rotates now.'
          except ImportError:out['resources']='BLOCKED_PYYAML_UNAVAILABLE'
          # Publish the tested application revision without touching customer records.
          shutil.copy2(root/'director.py',backup/'director.py')
          (root/'director.py').write_bytes(base64.b64decode(''));(root/'director.py').chmod(0o644)
          run(['docker','compose','-p','nordbridge-director','-f',str(root/'compose.yaml'),'up','-d','--no-build','--force-recreate'])
          time.sleep(5)
          test=r'''
          import director as d,json,time,uuid
          roles=['director','leads','tenders','contractors','financing','sales','communications','legal','website','marketing','products','crm','security']
          ids={}
          for role in roles:
           t=d.Task(role=role,stream='NORDBRIDGE' if role=='tenders' else 'TEST',task='INTERNAL TEST. Produce a bounded factual draft or report missing access. No price, law, client, payment or deadline invention. No external sending. Include https://nordbridge-global.com. Zynthoro investor outreach and BoVendia messages prohibited.',fingerprint='ROLETEST-'+role+'-'+str(uuid.uuid4()))
           ids[role]=d.enqueue(t)['id']
          for i in range(72):
           with d.db() as c:rows=c.execute('SELECT id,role,status,error FROM director.jobs WHERE id=ANY(%s::uuid[])',(list(ids.values()),)).fetchall()
           if all(r['status'] not in ('QUEUED','RUNNING') for r in rows):break
           time.sleep(4)
          with d.db() as c:
           results=[]
           for r in rows:
            result=c.execute('SELECT result FROM director.jobs WHERE id=%s',(r['id'],)).fetchone()['result'] or {}
            results.append({'role':r['role'],'status':r['status'],'error':r['error'],'external_sent':result.get('external_sent',0),'reason':result.get('reason'),'approval_required':result.get('approval_required')})
           print(json.dumps({'roles':results,'csp_configured':True,'no_external_sending_tools':True},default=str))
          '''
          try:out['roles']=json.loads(run(['docker','exec','-i','nordbridge-director-director-1','python3','-'],test,330))
          except Exception as e:out['roles']={'error':type(e).__name__}
          out['running_containers']=int(run(['docker','ps','-q']).count('\n'))
          Path('/var/backups/nordbridge-director/resource-roles.json').write_text(json.dumps(out,indent=2))
          print('RESOURCE_ROLE_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
