name: NordBridge external browser audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/nordbridge-external-browser-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "scripts/audit_network.py"
      - "scripts/tests/**"
      - "scripts/external_browser_audit.py"
      - "scripts/calculator_browser_tests.py"
      - "scripts/translation_browser_tests.py"
      - "scripts/mobile_nav_browser_tests.py"
      - "i18n.js"
      - "style.css"
      - ".github/workflows/nordbridge-external-browser-audit.yml"
  schedule:
    - cron: "43 6 * * *"
permissions:
  contents: read
jobs:
  external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Offline bounded-retry regression tests
        run: python -m unittest discover -s scripts/tests -p "test_audit_network.py" -v
      - name: Audit public site in desktop and mobile browsers
        id: browser
        continue-on-error: true
        run: python scripts/external_browser_audit.py
      - name: Test public calculators without submitting forms
        id: calculator
        if: always()
        continue-on-error: true
        run: python scripts/calculator_browser_tests.py
      - name: Verify four-language financing page switcher
        id: translation
        if: always()
        continue-on-error: true
        run: python scripts/translation_browser_tests.py
      - name: Test new mobile menu on checked-out branch (no production writes)
        id: mobile_menu
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nb-mobile-test-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          NORDBRIDGE_TEST_BASE=http://127.0.0.1:8765 python scripts/mobile_nav_browser_tests.py
      - name: Enforce full result and write readable summary
        if: always()
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outcome }}
          CALCULATOR: ${{ steps.calculator.outcome }}
          TRANSLATION: ${{ steps.translation.outcome }}
          MOBILE_MENU: ${{ steps.mobile_menu.outcome }}
        run: |
          echo "### NordBridge public browser health" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site pages and responsive layout | $BROWSER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Financing calculators | $CALCULATOR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EN/UK/DA/AR language switcher | $TRANSLATION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Accessible mobile menu and keyboard navigation | $MOBILE_MENU |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BROWSER" != success || "$CALCULATOR" != success || "$TRANSLATION" != success || "$MOBILE_MENU" != success ]]; then
            echo "::error::One or more public-site checks failed; inspect individual logs"
            exit 1
          fi
