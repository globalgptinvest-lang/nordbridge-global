name: NordBridge intake monitoring and restored draft proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import ast,base64,datetime,json,subprocess,shutil,hashlib,urllib.request
          from pathlib import Path
          root=Path('/opt/nordbridge-director');backup=Path('/var/backups/nordbridge-director')/('intake-monitor-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ'));backup.mkdir(mode=0o700)
          replacements=[('monitor.py', 'e9c7c0af986ad99c81356e49c1647746c1a11b34f3b0fe0ca67f46c5843a8ae0', 'https://api.github.com/repos/globalgptinvest-lang/nordbridge-global/contents/ops/director/monitor.py?ref=42a004226938427c9a8763762870b442c4fa4dee', 'b585425f36b7207d4175bc14fbf97488161d9a18586b106a36899a02bc3e9f63'), ('maintenance.py', '00811075e6206d62920e247542f7e846c6251149ba7d67df0e3e04c3b3903334', 'https://api.github.com/repos/globalgptinvest-lang/nordbridge-global/contents/ops/nordbridge-maintenance.py?ref=76fe6bbcac1f23b8b5fc84de9bd150a0c014ef7e', '7023a360dbf21c4981b51ebd8c3c9ee92cbb072b8c56a45cbccd17bdebeb8c3f')]
          prepared=[]
          for name,expected_source_sha,url,digest in replacements:
           p=root/name
           actual_source_sha=hashlib.sha256(p.read_bytes()).hexdigest();print('SOURCE_SHA_'+name+'='+actual_source_sha);assert actual_source_sha==expected_source_sha,'source_changed_review_required_'+name
           opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
           request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'NordBridge-ops'})
           with opener.open(request,timeout=25) as response: payload=json.loads(response.read(200000));new=base64.b64decode(payload['content'])
           print('REVIEWED_SHA_'+name+'='+hashlib.sha256(new).hexdigest());assert hashlib.sha256(new).hexdigest()==digest,'reviewed_source_checksum_mismatch'
           compile(new,name,'exec');shutil.copy2(p,backup/name);prepared.append((name,new))
          for name,new in prepared:
           p=root/name;tmp=root/(name+'.next');tmp.write_bytes(new);tmp.chmod(0o644);tmp.replace(p)
          def command(args,timeout=180):
           p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed_'+str(p.returncode))
           return p.stdout
          initial=json.loads(command(['python3',str(root/'monitor.py')],100));assert initial['healthy'] and initial['website_intake']['healthy']
          command(['systemctl','start','nordbridge-recovery-backup.service'],300)
          report=json.loads(sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1].read_text());assert len(report['postgres'])==2 and all(x.get('restore',{}).get('status')=='WORKING' for x in report['postgres'])
          checks=[check['director_restored'] for pg in report['postgres'] for check in pg['restore'].get('application_checks',[]) if 'director_restored' in check]
          assert checks and checks[0]['website_test_drafts']>=1 and checks[0]['website_contacts']>=1
          final=json.loads(command(['python3',str(root/'monitor.py')],100));assert final['healthy']
          containers=command(['docker','ps','--format','{{.Names}}|{{.State}}'])
          print('INTAKE_FINAL_STATE='+json.dumps({'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'backup_directory':report['backup_directory'],'restore_checks':checks,'all_postgres_restores_pass':True,'monitor':final,'containers':containers,'rollback':str(backup)}))
          NB_REMOTE_PAYLOAD

