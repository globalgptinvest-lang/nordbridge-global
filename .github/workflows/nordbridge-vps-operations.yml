name: NordBridge Director recovery and bounded schedules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,secrets,shutil,subprocess,time
          from pathlib import Path
          FILES={'director.py': '', 'tick.py': '', 'monitor.py': ''}
          os.umask(0o077)
          def run(args,stdin=None,timeout=180):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          root=Path('/opt/nordbridge-director')
          backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('operations-%Y%m%dT%H%M%SZ')
          backup.mkdir(mode=0o700)
          for f in root.iterdir():
           if f.is_file():shutil.copy2(f,backup/f.name)
          for name,data in FILES.items():
           p=root/name;p.write_bytes(base64.b64decode(data));p.chmod(0o644 if name.endswith('.py') else 0o600)
          envfile=root/'director.env';env=dict(x.split('=',1) for x in envfile.read_text().splitlines() if '=' in x)
          pg='nordbridge-office-postgres-1';pgi=json.loads(run(['docker','inspect',pg]))[0];pge=dict(x.split('=',1) for x in pgi['Config']['Env'] if '=' in x)
          admin=pge.get('POSTGRES_USER','postgres')
          if 'OPPORTUNITY_DSN' not in env:
           password=secrets.token_hex(32)
           sql=f"DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='nb_director_reader') THEN CREATE ROLE nb_director_reader LOGIN PASSWORD '{password}'; END IF; END $$; GRANT CONNECT ON DATABASE nordbridge TO nb_director_reader; GRANT USAGE ON SCHEMA office TO nb_director_reader; GRANT SELECT ON office.opportunities TO nb_director_reader;"
           run(['docker','exec','-i',pg,'psql','-U',admin,'-d','nordbridge','-v','ON_ERROR_STOP=1'],sql)
           env['OPPORTUNITY_DSN']=f'postgresql://nb_director_reader:{password}@postgres:5432/nordbridge'
           envfile.write_text('\n'.join(k+'='+v for k,v in env.items())+'\n');envfile.chmod(0o600)
          compose=(root/'compose.yaml').read_text()
          if './tick.py' not in compose:
           compose=compose.replace('volumes: ["./director.py:/app/director.py:ro"]','volumes: ["./director.py:/app/director.py:ro", "./tick.py:/app/tick.py:ro"]')
           (root/'compose.yaml').write_text(compose)
          dc=['docker','compose','-p','nordbridge-director','-f',str(root/'compose.yaml')]
          run(dc+['config','--quiet']);run(dc+['up','-d','--no-build','--force-recreate'])
          # Reload the actual new Caddyfile through stdin; single-file mounts can otherwise retain the old inode.
          caddy=Path('/opt/nordbridge-office/caddy/Caddyfile').read_text()
          run(['docker','exec','-i','nordbridge-office-caddy-1','caddy','validate','--config','-','--adapter','caddyfile'],caddy)
          run(['docker','exec','-i','nordbridge-office-caddy-1','caddy','reload','--config','-','--adapter','caddyfile'],caddy)
          print('CADDY_ACTUAL_CONFIG_RELOADED=PASS',flush=True)
          service=Path('/etc/systemd/system/nordbridge-director-monitor.service')
          service.write_text('[Unit]\nDescription=NordBridge Director bounded health and durable schedules\nAfter=docker.service network-online.target\n[Service]\nType=oneshot\nExecStart=/usr/bin/python3 /opt/nordbridge-director/monitor.py\nTimeoutStartSec=120\nNice=10\n')
          Path('/etc/systemd/system/nordbridge-director-monitor.timer').write_text('[Unit]\nDescription=NordBridge Director five minute monitoring\n[Timer]\nOnCalendar=*-*-* *:0/5:00\nPersistent=true\nRandomizedDelaySec=15\nUnit=nordbridge-director-monitor.service\n[Install]\nWantedBy=timers.target\n')
          # Change the existing official TED timer, rather than introduce another search service.
          drop=Path('/etc/systemd/system/nordbridge-ted-connector.timer.d');drop.mkdir(exist_ok=True)
          (drop/'hourly.conf').write_text('[Timer]\nOnCalendar=\nOnCalendar=*-*-* *:12:00 UTC\nRandomizedDelaySec=45\nPersistent=true\n')
          run(['systemctl','daemon-reload']);run(['systemctl','enable','--now','nordbridge-director-monitor.timer'])
          run(['systemctl','restart','nordbridge-ted-connector.timer'])
          time.sleep(5)
          print('INITIAL_TICK='+run(['python3',str(root/'monitor.py')]).strip(),flush=True)
          print('FAILURE_DETECTION_TEST='+run(['python3',str(root/'monitor.py'),'--simulate-failure']).strip(),flush=True)
          print('RECOVERY_DETECTION_TEST='+run(['python3',str(root/'monitor.py')]).strip(),flush=True)
          print('SECOND_TICK_DEDUPE='+run(['python3',str(root/'monitor.py')]).strip(),flush=True)
          print('TIMERS='+run(['systemctl','is-active','nordbridge-director-monitor.timer','nordbridge-ted-connector.timer']).strip().replace('\n',','),flush=True)
          NB_REMOTE_PAYLOAD
