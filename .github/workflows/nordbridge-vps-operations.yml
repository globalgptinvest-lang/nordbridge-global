name: NordBridge mobile preview form to PostgreSQL E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,subprocess,json,datetime
          from pathlib import Path
          root=Path('/root/nordbridge-intake-provision');packet=root/'preview.enc';packet.write_bytes(base64.b64decode(''))
          p=subprocess.run(['openssl','pkeyutl','-decrypt','-inkey',str(root/'transport-key.pem'),'-in',str(packet),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],capture_output=True,text=True,check=True)
          share=p.stdout.strip()
          code=r'''
          import asyncio,json,urllib.parse
          from playwright.async_api import async_playwright
          async def main():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
            ctx=await browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            async def guard(route):
             u=route.request.url
             if any(x in u for x in ['google-analytics.com','googletagmanager.com','formsubmit.co','stripe.com']):await route.abort()
             else:await route.continue_()
            await ctx.route('**/*',guard)
            page=await ctx.new_page();await page.goto(SHARE,wait_until='domcontentloaded',timeout=45000)
            base=urllib.parse.urlsplit(SHARE);base=base.scheme+'://'+base.netloc
            r=await page.goto(base+'/free-tender-fit-check.html',wait_until='domcontentloaded',timeout=45000)
            await page.wait_for_function("document.querySelector('form.lead-form')?.dataset.intakeEnabled==='true'",timeout=30000)
            await page.wait_for_function("document.querySelector('input[name=\"cf-turnstile-response\"]')?.value.length>0",timeout=30000)
            await page.locator('[name="Company name"]').fill('NordBridge INTERNAL SYNTHETIC TEST')
            await page.locator('[name="Email"]').fill('info@nordbridge-global.com')
            await page.locator('[name="Country"]').fill('Denmark')
            await page.locator('[name="Fit check request"]').fill('INTERNAL STAGING TEST. No commercial action or external message.')
            await page.locator('[name="privacy_consent"]').check()
            await page.locator('form.lead-form').evaluate("""form=>form.addEventListener('submit',()=>{
              form.querySelector('[name="Lead source page"]').value='/internal-test';
              form.querySelector('[name="_subject"]').value='INTERNAL STAGING NO EXTERNAL ACTION';
              const n=form.querySelector('[name="_next"]'),u=new URL(n.value);u.searchParams.set('submission','STAGING-'+u.searchParams.get('submission'));n.value=u.href;
            })""")
            async with page.expect_response(lambda x:x.url==base+'/api/lead' and x.request.method=='POST',timeout=30000) as response:
             await page.locator('form.lead-form button[type="submit"]').click()
            response=await response.value
            body=response.request.post_data;parsed=urllib.parse.parse_qs(body)
            headers={'Origin':base,'Content-Type':'application/x-www-form-urlencoded'}
            replay=await ctx.request.post(base+'/api/lead',data=body,headers=headers,max_redirects=0,timeout=30000)
            bad=dict((k,v[0]) for k,v in parsed.items());bad['cf-turnstile-response']='invalid-token'
            invalid=await ctx.request.post(base+'/api/lead',form=bad,headers={'Origin':base},max_redirects=0,timeout=30000)
            bad['cf-turnstile-response']='XXXX.DUMMY.TOKEN.XXXX';bad['privacy_consent']=''
            consent=await ctx.request.post(base+'/api/lead',form=bad,headers={'Origin':base},max_redirects=0,timeout=30000)
            origin=await ctx.request.post(base+'/api/lead',data=body,headers={'Origin':'https://untrusted.example','Content-Type':'application/x-www-form-urlencoded'},max_redirects=0,timeout=30000)
            marker=urllib.parse.parse_qs(urllib.parse.urlsplit(parsed['_next'][0]).query)['submission'][0]
            out={'form_http':r.status,'mobile':True,'route_enabled':True,'post_http':response.status,'replay_http':replay.status,'invalid_challenge_http':invalid.status,'missing_consent_http':consent.status,'untrusted_origin_http':origin.status,'lead_id':'WEB-'+marker,'external_messages_sent':0,'uses_official_cloudflare_fixture':True}
            assert response.status==303 and replay.status==303 and invalid.status==403 and consent.status==400 and origin.status==403
            await browser.close();print(json.dumps(out))
          asyncio.run(main())
          '''
          r=subprocess.run(['docker','exec','-i','nordbridge-office-core-1','python3','-'],input='SHARE='+repr(share)+'\n'+code,capture_output=True,text=True,timeout=180)
          if r.returncode:
           # Error details are private because navigation exceptions can include the share URL.
           err=root/'preview-e2e-error.txt';err.write_text(r.stderr);err.chmod(0o600)
           raise RuntimeError('preview_e2e_failed_private_error_saved')
          out=json.loads(r.stdout.strip().splitlines()[-1]);lead=out['lead_id']
          check="import os,json,psycopg; c=psycopg.connect(os.environ['DATABASE_URL']);r=c.execute('SELECT count(*),min(status) FROM website_leads WHERE lead_id=%s',(LEAD,)).fetchone();print(json.dumps({'stored_count':r[0],'status':r[1]}));c.close()"
          r=subprocess.run(['docker','exec','nordbridge-crm-api-1','python3','-c','LEAD='+repr(lead)+'\n'+check],capture_output=True,text=True,check=True,timeout=30)
          out['postgres_readback']=json.loads(r.stdout);assert out['postgres_readback']=={'stored_count':1,'status':'INTERNAL_TEST'}
          out['time_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          print('PREVIEW_INTAKE_E2E='+json.dumps(out))
          
          NB_REMOTE_PAYLOAD
