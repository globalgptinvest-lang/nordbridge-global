name: NordBridge website enquiry to Director draft verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import ast,base64,datetime,hashlib,json,subprocess,shutil,time
          from pathlib import Path
          def run(args,timeout=180):
           p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed_'+str(p.returncode))
           return p.stdout
          root=Path('/opt/nordbridge-director');app=root/'director.py';expected=base64.b64decode('').decode();assert ast.dump(ast.parse(app.read_text()))==ast.dump(ast.parse(expected)),'source_changed_review_required'
          run(['systemctl','start','nordbridge-recovery-backup.service'],300)
          r=json.loads(sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1].read_text());assert len(r['postgres'])==2 and all(x.get('restore',{}).get('status')=='WORKING' for x in r['postgres'])
          backup=Path('/var/backups/nordbridge-director')/('website-sync-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ'));backup.mkdir(mode=0o700);shutil.copy2(app,backup/'director.py')
          source=base64.b64decode('').decode();compile(source,'director.py','exec');tmp=root/'director.py.next';tmp.write_text(source);tmp.chmod(0o644);tmp.replace(app)
          try:
           run(['docker','restart','nordbridge-director-director-1'],60)
           for _ in range(20):
            try:run(['docker','exec','nordbridge-director-director-1','python3','-c',"import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200"],10);break
            except Exception:time.sleep(2)
           else:raise RuntimeError('director_health_failed')
          except Exception:
           shutil.copy2(backup/'director.py',app);run(['docker','restart','nordbridge-director-director-1'],60);raise
          code="""import director as d,json
          first=d.website_intake_sync('TEST',TEST_LEAD)
          again=d.website_intake_sync('TEST',TEST_LEAD)
          live=d.website_intake_sync()
          assert first['processed']==1 and first['drafts_queued']==1 and again['processed']==0 and again['drafts_queued']==0
          print(json.dumps({'first':first,'repeat':again,'live_processed':live['processed'],'live_drafts_queued':live['drafts_queued']}))
          """
          result=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c','TEST_LEAD='+repr('WEB-STAGING-300af00f-6040-4c19-9bbb-85c6698b249c')+'\n'+code],45));job=result['first']['draft_job_ids'][0]
          verify="""import director as d,json
          with d.db() as c:
           r=c.execute('SELECT status,result FROM director.jobs WHERE id=%s',(JOB,)).fetchone()
           p=c.execute("SELECT count(*) n, bool_and(data->>'approval_required'='true') gated, bool_and(length(coalesce(data->'draft'->>'draft',''))>35) nonempty FROM director.proposals WHERE stream='TEST' AND data->>'draft_job_id'=%s",(JOB,)).fetchone()
           leaks=c.execute("SELECT count(*) n FROM director.leads WHERE stream<>'TEST' AND data->'source_evidence'->>'source_lead_id'=%s",(TEST_LEAD,)).fetchone()['n']
           print(json.dumps({'job_status':r['status'],'proposal_count':p['n'],'approval_required':p['gated'],'substantive_draft':p['nonempty'],'test_leaked_into_business_streams':leaks,'external_sent':r.get('result',{}).get('external_sent') if r.get('result') else None}))
          """
          for _ in range(60):
           final=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c','JOB='+repr(job)+'\nTEST_LEAD='+repr('WEB-STAGING-300af00f-6040-4c19-9bbb-85c6698b249c')+'\n'+verify],20))
           if final['job_status'] in ('DONE','FAILED','BLOCKED'):break
           time.sleep(3)
          assert final['job_status']=='DONE' and final['proposal_count']==1 and final['approval_required'] and final['substantive_draft'] and final['test_leaked_into_business_streams']==0 and final['external_sent']==0
          print('WEBSITE_DIRECTOR_PIPELINE='+json.dumps({'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'backup':str(backup),'db_backup':r.get('backup_directory'),'sync':result,'verification':final}))
          
          NB_REMOTE_PAYLOAD
