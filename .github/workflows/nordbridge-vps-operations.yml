name: NordBridge official need to CRM and gated draft proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess,time
          from pathlib import Path
          FILES={'research.py': '', 'monitor.py': '', 'director.py': ''}
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          os.umask(0o077);root=Path('/opt/nordbridge-director');dest=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('qualified-source-%Y%m%dT%H%M%SZ');dest.mkdir(mode=0o700)
          run(['python3',str(root/'maintenance.py')],timeout=1800)
          for attempt in range(20):
           n=int(run(['docker','exec','nordbridge-director-director-1','python3','-c',"import director as d;c=d.db();print(c.execute(\"SELECT count(*) n FROM director.jobs WHERE status IN ('RUNNING','WAITING')\").fetchone()['n']);c.close()" ]))
           if n==0:break
           time.sleep(3)
          else:raise RuntimeError('active_jobs_update_postponed')
          for name,data in FILES.items():
           shutil.copy2(root/name,dest/name);source=base64.b64decode(data).decode();compile(source,name,'exec');(root/name).write_text(source);(root/name).chmod(0o644)
          run(['docker','compose','-p','nordbridge-director','-f',str(root/'compose.yaml'),'up','-d','--no-build','--force-recreate']);time.sleep(5)
          code=r'''
          import director as d,json,time
          from research import scan
          out={'lead_scan':scan({'role':'leads','stream':'NORDBRIDGE'})}
          out['lead_repeat']=scan({'role':'leads','stream':'NORDBRIDGE'})
          for attempt in range(80):
           with d.db() as c:
            jobs=c.execute("SELECT id,status,error,result FROM director.jobs WHERE fingerprint LIKE 'LEAD-DRAFT-%' ORDER BY created_at DESC LIMIT 5").fetchall()
           if not jobs or all(x['status'] not in ('QUEUED','RUNNING','WAITING') for x in jobs):break
           time.sleep(2)
          out['sales_drafts']=[{'id':str(x['id']),'status':x['status'],'error':x['error'],'nonempty':bool((x['result'] or {}).get('draft',{}).get('draft')),'has_website':'https://nordbridge-global.com' in (x['result'] or {}).get('draft',{}).get('draft',''),'approval_required':(x['result'] or {}).get('approval_required'),'external_sent':(x['result'] or {}).get('external_sent')} for x in jobs]
          with d.db() as c:
           out['lead_count']=c.execute("SELECT count(*) n FROM director.leads WHERE stream='NORDBRIDGE'").fetchone()['n']
           out['lead_briefs']=c.execute("SELECT count(*) n FROM director.proposals WHERE data->'source_evidence'->>'kind'='lead_qualification_brief'").fetchone()['n']
          print(json.dumps(out))
          '''
          out={'research':json.loads(run(['docker','exec','-i','nordbridge-director-director-1','python3','-'],code,230))}
          out['daily_report_test']=json.loads(run(['python3',str(root/'monitor.py'),'--send-daily-test']))
          out['time_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (dest/'result.json').write_text(json.dumps(out,indent=2))
          print('REAL_LEAD_DRAFT_PROOF='+json.dumps(out))
          NB_REMOTE_PAYLOAD
