name: NordBridge scoped intake deployment and readback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,hashlib,json,subprocess,shutil,time,os,yaml
          from pathlib import Path
          def run(args,timeout=180):
           p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed_'+str(p.returncode))
           return p.stdout
          root=Path('/home/ubuntu/nordbridge_server_crm/server_crm');api=root/'api.py';compose=root/'compose.yaml'
          assert hashlib.sha256(api.read_bytes()).hexdigest()=='63ad7fdec9134f63e1df527c9b4170878b20a8de3566e70ba5c03e262b143bce','source_changed_review_required'
          run(['systemctl','start','nordbridge-recovery-backup.service'],300)
          r=json.loads(sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1].read_text());assert len(r['postgres'])==2 and all(x.get('restore',{}).get('status')=='WORKING' for x in r['postgres'])
          stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ');backup=Path('/var/backups/nordbridge-director')/('intake-cutover-'+stamp);backup.mkdir(mode=0o700)
          shutil.copy2(api,backup/'api.py');shutil.copy2(compose,backup/'compose.yaml')
          secret=root/'.env.intake-scoped';existed=secret.exists()
          if existed:shutil.copy2(secret,backup/'env.intake-scoped')
          packet=Path('/root/nordbridge-intake-provision/packet.enc');packet.write_bytes(base64.b64decode(''))
          plain=run(['openssl','pkeyutl','-decrypt','-inkey','/root/nordbridge-intake-provision/transport-key.pem','-in',str(packet),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'])
          keys=json.loads(plain);assert all(len(keys[x])==64 for x in ('production','test'))
          secret.write_text('CRM_WEBSITE_INGEST_TOKEN='+keys['production']+'\nCRM_WEBSITE_TEST_TOKEN='+keys['test']+'\n');secret.chmod(0o600)
          source=base64.b64decode('').decode();compile(source,'api.py','exec')
          conf=yaml.safe_load(compose.read_text());service=conf['services']['api'];envfiles=service.get('env_file',[])
          if isinstance(envfiles,str):envfiles=[envfiles]
          service['env_file']=envfiles+[str(secret)] if str(secret) not in envfiles else envfiles
          service['volumes']=[x for x in service.get('volumes',[]) if not (isinstance(x,str) and ':/app/api.py' in x)]+[str(api)+':/app/api.py:ro']
          dc=['docker','compose','-p','nordbridge-crm','-f',str(compose)]
          try:
           api.write_text(source);api.chmod(0o644);compose.write_text(yaml.safe_dump(conf,sort_keys=False));compose.chmod(0o600)
           run(dc+['config','--quiet']);run(dc+['up','-d','--no-build','--no-deps','api'],100)
           for _ in range(20):
            try:run(['docker','exec','nordbridge-crm-api-1','python3','-c',"import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200"],10);break
            except Exception:time.sleep(2)
           else:raise RuntimeError('crm_health_failed')
           code="""import os,json,requests,uuid,psycopg
          out={}
          with requests.Session() as c:
           c.trust_env=False
           for kind,key in [('production','CRM_WEBSITE_INGEST_TOKEN'),('test','CRM_WEBSITE_TEST_TOKEN')]:
            lead='WEB-STAGING-'+uuid.uuid4().hex
            p={'lead_id':lead,'company':'NordBridge INTERNAL SYNTHETIC TEST','email':'info@nordbridge-global.com','country':'Denmark','source_form':'INTERNAL STAGING NO EXTERNAL ACTION','service':'NO COMMERCIAL ACTION - TEST','source_page':'/internal-test','privacy_consent':True}
            h={'Authorization':'Bearer '+os.environ[key]}
            url='https://crm.57.129.182.200.sslip.io/v1/website-leads'
            a=c.post(url,json=p,headers=h,timeout=20);b=c.post(url,json=p,headers=h,timeout=20)
            deny=c.get('http://127.0.0.1:8000/v1/jobs',headers=h,timeout=10)
            bad=dict(p,company='Not an internal synthetic record')
            invalid=c.post(url,json=bad,headers=h,timeout=10).status_code if kind=='test' else None
            with psycopg.connect(os.environ['DATABASE_URL']) as db:
             count=db.execute('SELECT count(*) FROM website_leads WHERE lead_id=%s',(lead,)).fetchone()[0]
             db.execute("UPDATE website_leads SET status='INTERNAL_TEST' WHERE lead_id=%s",(lead,))
            out[kind]={'lead_id':lead,'http':a.status_code,'created':a.json().get('created'),'duplicate_created':b.json().get('created'),'stored_count':count,'read_api_denied':deny.status_code==401,'non_synthetic_denied':invalid==403 if kind=='test' else None}
            assert a.status_code==200 and a.json()['created'] and not b.json()['created'] and count==1 and deny.status_code==401
            if kind=='test':assert invalid==403
           out['unauthorized_post']=c.post(url,json=p,timeout=10).status_code
           assert out['unauthorized_post']==401
          print(json.dumps(out))
          """
           result=json.loads(run(['docker','exec','nordbridge-crm-api-1','python3','-c',code],120))
           print('SCOPED_INTAKE_DEPLOY='+json.dumps({'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'backup':str(backup),'db_backup':r.get('backup_directory'),'tests':result}))
          except Exception:
           shutil.copy2(backup/'api.py',api);shutil.copy2(backup/'compose.yaml',compose)
           if existed:shutil.copy2(backup/'env.intake-scoped',secret)
           run(dc+['up','-d','--no-build','--no-deps','api'],100);raise
          
          NB_REMOTE_PAYLOAD
