name: NordBridge production intake post-deploy verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import subprocess,json,datetime
          code=r'''
          import asyncio,json,httpx,uuid
          from playwright.async_api import async_playwright
          base='https://www.nordbridge-global.com'
          out={}
          with httpx.Client(timeout=25,trust_env=False,follow_redirects=False) as c:
           cfg=c.get(base+'/api/intake-status');data=cfg.json()
           out['readiness']={'http':cfg.status_code,'ready':data.get('ready'),'test_mode':data.get('testing',False),'production_sitekey_unchanged':data.get('sitekey')=='0x4AAAAAAFZMXtmGr4bwyAS9'}
           marker='PRODTEST-'+uuid.uuid4().hex
           body={'_next':'https://nordbridge-global.com/thanks.html?submission='+marker,'Company name':'NordBridge INTERNAL SYNTHETIC TEST','Email':'info@nordbridge-global.com','Country':'Denmark','_subject':'INTERNAL PRODUCTION VERIFY','Lead source page':'/internal-test','privacy_consent':'accepted','cf-turnstile-response':'XXXX.DUMMY.TOKEN.XXXX'}
           h={'Origin':base}
           out['dummy_challenge_rejected']=c.post(base+'/api/lead',data=body,headers=h).status_code
           out['untrusted_origin_rejected']=c.post(base+'/api/lead',data=body,headers={'Origin':'https://untrusted.example'}).status_code
           out['missing_consent_rejected']=c.post(base+'/api/lead',data={**body,'privacy_consent':''},headers=h).status_code
           out['get_rejected']=c.get(base+'/api/lead').status_code
           out['oversize_rejected']=c.post(base+'/api/lead',content='x'*17000,headers={**h,'Content-Type':'application/x-www-form-urlencoded'}).status_code
           assert out['readiness']=={'http':200,'ready':True,'test_mode':False,'production_sitekey_unchanged':True}
           assert [out[k] for k in ['dummy_challenge_rejected','untrusted_origin_rejected','missing_consent_rejected','get_rejected','oversize_rejected']]==[403,403,400,405,413]
          async def browser_test():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
            ctx=await browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            async def guard(route):
             if any(x in route.request.url for x in ['google-analytics.com','googletagmanager.com','formsubmit.co','stripe.com']):await route.abort()
             else:await route.continue_()
            await ctx.route('**/*',guard)
            page=await ctx.new_page();r=await page.goto(base+'/free-tender-fit-check.html',wait_until='domcontentloaded',timeout=45000)
            await page.wait_for_function("document.querySelector('form.lead-form')?.dataset.intakeEnabled==='true'",timeout=20000)
            out['mobile_form_http']=r.status;out['production_form_route_active']=True
            try:await page.wait_for_function("document.querySelector('input[name=\"cf-turnstile-response\"]')?.value.length>0",timeout=25000);challenge=True
            except Exception:challenge=False
            out['real_browser_challenge_completed']=challenge
            if challenge:
             await page.locator('[name="Company name"]').fill('NordBridge INTERNAL SYNTHETIC TEST')
             await page.locator('[name="Email"]').fill('info@nordbridge-global.com')
             await page.locator('[name="Country"]').fill('Denmark')
             await page.locator('[name="Fit check request"]').fill('INTERNAL PRODUCTION TEST. No commercial action or external message.')
             await page.locator('[name="privacy_consent"]').check()
             await page.locator('[name="_subject"]').evaluate("e=>e.value='INTERNAL PRODUCTION VERIFY'")
             async with page.expect_response(lambda x:x.url==base+'/api/lead' and x.request.method=='POST',timeout=30000) as receipt:
              await page.locator('form.lead-form button[type="submit"]').click()
             receipt=await receipt.value;out['production_positive_http']=receipt.status
             if receipt.status==303:
              import urllib.parse
              location=(await receipt.all_headers()).get('location','');out['lead_id']='WEB-'+urllib.parse.parse_qs(urllib.parse.urlsplit(location).query)['submission'][0]
            await browser.close()
          asyncio.run(browser_test())
          print(json.dumps(out))
          '''
          r=subprocess.run(['docker','exec','-i','nordbridge-office-core-1','python3','-'],input=code,capture_output=True,text=True,timeout=180)
          if r.returncode:raise RuntimeError('production_check_failed_'+str(r.returncode))
          out=json.loads(r.stdout.strip().splitlines()[-1])
          if out.get('lead_id'):
           check="import os,json,psycopg; c=psycopg.connect(os.environ['DATABASE_URL']);r=c.execute('SELECT count(*) FROM website_leads WHERE lead_id=%s',(LEAD,)).fetchone();c.execute(\"UPDATE website_leads SET status='INTERNAL_TEST' WHERE lead_id=%s\",(LEAD,));c.commit();print(json.dumps({'stored_count':r[0],'marked_internal_test':True}));c.close()"
           r=subprocess.run(['docker','exec','nordbridge-crm-api-1','python3','-c','LEAD='+repr(out['lead_id'])+'\n'+check],capture_output=True,text=True,check=True,timeout=30)
           out['production_postgres_readback']=json.loads(r.stdout);assert out['production_postgres_readback']['stored_count']==1
          out['time_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat();out['external_messages_sent']=0
          print('PRODUCTION_INTAKE_CHECK='+json.dumps(out))
          NB_REMOTE_PAYLOAD
