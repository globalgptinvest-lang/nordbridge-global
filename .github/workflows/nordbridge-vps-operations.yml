name: NordBridge intake configuration validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import json,subprocess,hashlib
          from pathlib import Path
          root=Path('/home/ubuntu/nordbridge_server_crm/server_crm')
          p=subprocess.run(['docker','compose','-f',str(root/'compose.yaml'),'config','--format','json'],capture_output=True,text=True,check=True)
          c=json.loads(p.stdout)
          out={'services':{k:{'image':v.get('image'),'build':bool(v.get('build')),'environment_keys':list(v.get('environment',{})),'volumes':v.get('volumes',[]),'ports':v.get('ports',[])} for k,v in c['services'].items()},'host_api_exists':(root/'api.py').exists()}
          if (root/'api.py').exists():out['host_api_sha256']=hashlib.sha256((root/'api.py').read_bytes()).hexdigest()
          out['container_api_sha256']=subprocess.run(['docker','exec','nordbridge-crm-api-1','python3','-c',"import pathlib,hashlib;print(hashlib.sha256(pathlib.Path('/app/api.py').read_bytes()).hexdigest())"],capture_output=True,text=True,check=True).stdout.strip()
          out['yaml_available']=subprocess.run(['python3','-c','import yaml'],capture_output=True).returncode==0
          code='''import httpx,json
          with httpx.Client(timeout=20,trust_env=False,follow_redirects=True) as c:
           out={}
           for u in ['https://nordbridge-global.com/api/intake-status','https://nordbridge-global.com/free-tender-fit-check.html']:
            r=c.get(u);out[u]={'final_url':str(r.url),'http':r.status_code,'json':r.json() if 'application/json' in r.headers.get('content-type','') else None,'has_formsubmit':'formsubmit.co/' in r.text,'has_intake_script':'forms-intake.js' in r.text}
           print(json.dumps(out))
          '''
          r=subprocess.run(['docker','exec','nordbridge-director-director-1','python3','-c',code],capture_output=True,text=True,check=True);out['public']=json.loads(r.stdout)
          print('INTAKE_PREDEPLOY='+json.dumps(out))
          NB_REMOTE_PAYLOAD
