name: NordBridge scheduled continuation verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import datetime,json,subprocess
          from pathlib import Path
          def run(args,timeout=45):
           p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
           if p.returncode: return {'error':'command_failed','exit':p.returncode}
           try:return json.loads(p.stdout)
           except ValueError:return p.stdout.strip()
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          out['containers']=run(['docker','ps','-a','--format','{{json .Names}} {{json .State}} {{json .Status}}'])
          out['monitor']=json.loads(Path('/var/lib/nordbridge-director-monitor.json').read_text())
          out['timers']=run(['systemctl','list-timers','--all','--no-pager','nordbridge-*'])
          code='''import director as d,json
          with d.db() as c:
           jobs=c.execute("SELECT role,status,count(*) n,max(updated_at)::text last_update FROM director.jobs WHERE created_at>now()-interval '4 hours' GROUP BY role,status ORDER BY role,status").fetchall()
           schedules=c.execute("SELECT role,count(*) n,min(created_at)::text first_run,max(created_at)::text last_run FROM director.schedule_runs WHERE created_at>now()-interval '4 hours' GROUP BY role ORDER BY role").fetchall()
           counts={t:c.execute('SELECT stream,count(*) n FROM director.'+t+' GROUP BY stream').fetchall() for t in ('leads','contractors','opportunities','proposals')}
           recent=c.execute("SELECT role,status,error,result FROM director.jobs WHERE role IN ('leads','contractors','financing') ORDER BY created_at DESC LIMIT 9").fetchall()
          print(json.dumps({'jobs':jobs,'schedules':schedules,'counts':counts,'research_results':recent},default=str))
          '''
          out['director']=run(['docker','exec','nordbridge-director-director-1','python3','-c',code])
          print('NEXT_AUDIT_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
