name: NordBridge continuation final data and backup verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess
          from pathlib import Path
          os.umask(0o077);root=Path('/opt/nordbridge-director')
          dest=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('continuation-final-%Y%m%dT%H%M%SZ');dest.mkdir(mode=0o700)
          shutil.copy2(root/'maintenance.py',dest/'maintenance-before.py')
          (root/'maintenance.py').write_bytes(base64.b64decode(''));(root/'maintenance.py').chmod(0o600)
          p=subprocess.run(['systemctl','start','nordbridge-recovery-backup.service'],capture_output=True,text=True,timeout=1800)
          last=sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1];backup=json.loads(last.read_text())
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'backup_service_exit':p.returncode,'backup':{k:backup[k] for k in ['backup_directory','postgres']}}
          data=subprocess.check_output(['python3',str(root/'monitor.py')],text=True,timeout=120);out['monitor']=json.loads(data)
          cs=json.loads(subprocess.check_output(['docker','inspect']+subprocess.check_output(['docker','ps','-q'],text=True).split(),text=True))
          out['containers']=[{'name':c['Name'],'running':c['State']['Running'],'health':c['State'].get('Health',{}).get('Status')} for c in cs]
          out['timer']=subprocess.check_output(['systemctl','show','nordbridge-director-monitor.timer','-p','ActiveState','-p','LastTriggerUSec','-p','NextElapseUSecRealtime'],text=True)
          code="import director as d,json; c=d.db();print(json.dumps({'source_schedules':c.execute(\"SELECT role,count(*) n,max(created_at)::text last FROM director.schedule_runs WHERE role IN ('leads','contractors','financing') GROUP BY role\").fetchall(),'open_tasks':c.execute(\"SELECT count(*) n FROM director.jobs WHERE status IN ('QUEUED','RUNNING','WAITING')\").fetchone()['n'],'source_entities':{'leads':c.execute(\"SELECT count(*) n FROM director.leads WHERE stream='NORDBRIDGE'\").fetchone()['n'],'contractors':c.execute(\"SELECT count(*) n FROM director.contractors WHERE stream='NORDBRIDGE'\").fetchone()['n'],'funding_programmes':c.execute(\"SELECT count(*) n FROM director.opportunities WHERE stream='FINANCING'\").fetchone()['n']}}));c.close()"
          out['crm']=json.loads(subprocess.check_output(['docker','exec','nordbridge-director-director-1','python3','-c',code],text=True,timeout=30))
          (dest/'result.json').write_text(json.dumps(out,indent=2))
          print('CONTINUATION_FINAL='+json.dumps(out))
          if p.returncode or len(out['containers'])!=11 or not out['monitor']['healthy']:raise RuntimeError('continuation_final_check_failed')
          NB_REMOTE_PAYLOAD
