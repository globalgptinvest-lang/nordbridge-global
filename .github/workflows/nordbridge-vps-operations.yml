name: NordBridge continuation audit and public source probes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import datetime,json,subprocess
          from pathlib import Path
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          def run(args,code=None,timeout=120):
           p=subprocess.run(args,input=code,text=True,capture_output=True,timeout=timeout)
           if p.returncode:return {'error':'exit_'+str(p.returncode)}
           try:return json.loads(p.stdout)
           except:return {'error':'invalid_output'}
          out['monitor']=json.loads(Path('/var/lib/nordbridge-director-monitor.json').read_text())
          latest=sorted(p for p in Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1]
          backup=json.loads(latest.read_text())
          out['latest_backup']={k:backup.get(k) for k in ['time_utc','backup_directory','configuration_files_backed_up','postgres']}
          out['containers']=run(['docker','ps','--format','{{json .Names}}']) if False else subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True).split()
          code=r'''
          import director as d,json,httpx,datetime
          with d.db() as c:
           jobs=c.execute('SELECT role,status,count(*) n FROM director.jobs GROUP BY role,status').fetchall()
           schedules=c.execute('SELECT role,count(*) n,max(created_at)::text last FROM director.schedule_runs GROUP BY role').fetchall()
          out={'jobs':jobs,'schedules':schedules,'sources':{}}
          with httpx.Client(timeout=25,follow_redirects=True,trust_env=False,headers={'User-Agent':'NordBridgePublicResearch/1.0'}) as client:
           start=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=4)).strftime('%Y-%m-%dT00:00:00')
           for stage in ['tender','award']:
            try:
             r=client.get('https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages',params={'updatedFrom':start,'stages':stage,'limit':100});r.raise_for_status();p=r.json()
             rows=p.get('releases',[]);sample=[]
             for row in rows[:8]:
              t=row.get('tender') or {};a=row.get('awards') or []
              sample.append({'id':row.get('id'),'date':row.get('date'),'tag':row.get('tag'),'title':t.get('title'),'status':t.get('status'),'deadline':(t.get('tenderPeriod') or {}).get('endDate'),'buyer':(row.get('buyer') or {}).get('name'),'value':t.get('value'),'supplier_names':[s.get('name') for x in a for s in x.get('suppliers',[])]})
             out['sources'][stage]={'http':r.status_code,'count':len(rows),'top_keys':list(p),'sample':sample}
            except Exception as e:out['sources'][stage]={'error':type(e).__name__}
          print(json.dumps(out,default=str))
          '''
          out['office']=run(['docker','exec','-i','nordbridge-director-director-1','python3','-'],code)
          print('CONTINUATION_PROBE='+json.dumps(out))
          NB_REMOTE_PAYLOAD
