name: NordBridge grant deadline evidence repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,subprocess,shutil,time
          from pathlib import Path
          def run(args,timeout=180):
           p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed_'+str(p.returncode))
           return p.stdout
          # Verified dual-database backup must pass before modifying code or CRM evidence.
          run(['systemctl','start','nordbridge-recovery-backup.service'],300)
          latest=sorted(Path('/var/backups/nordbridge-maintenance').glob('*/result.json'))[-1]
          backup=json.loads(latest.read_text());assert len(backup['postgres'])==2 and all(x.get('restore',{}).get('status')=='WORKING' for x in backup['postgres'])
          root=Path('/opt/nordbridge-director');stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          old=root/'research.py';snap=Path('/var/backups/nordbridge-director')/('grant-deadline-'+stamp);snap.mkdir(mode=0o700)
          shutil.copy2(old,snap/'research.py')
          source=base64.b64decode('').decode();compile(source,'research.py','exec')
          tmp=root/'research.py.next';tmp.write_text(source);tmp.chmod(0o644);tmp.replace(old)
          try:
           run(['docker','restart','nordbridge-director-director-1'],60)
           for _ in range(15):
            try:run(['docker','exec','nordbridge-director-director-1','python3','-c',"import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200"],10);break
            except Exception:time.sleep(2)
           else:raise RuntimeError('health_failed')
           code="import research,json;print(json.dumps(research.run({'role':'financing','stream':'FINANCING'})))"
           result=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c',code],90));assert result['status']=='DONE'
           check="""import director as d,json
          with d.db() as c:
           rows=c.execute("SELECT count(*) total,count(*) FILTER(WHERE data->'source_evidence'->>'deadline_requires_review'='true') review,count(*) FILTER(WHERE (data->'source_evidence'->>'source_deadline_date')>='2099-01-01' AND data->'source_evidence'->>'deadline_date' IS NOT NULL) unsafe FROM director.opportunities WHERE stream='FINANCING'").fetchone()
          print(json.dumps(rows))
          """
           verified=json.loads(run(['docker','exec','nordbridge-director-director-1','python3','-c',check]));assert verified['unsafe']==0
           print('GRANT_DATE_FIX_RESULT='+json.dumps({'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'backup':str(latest.parent),'rollback':str(snap),'result':result,'crm':verified}))
          except Exception:
           shutil.copy2(snap/'research.py',old);run(['docker','restart','nordbridge-director-director-1'],60);raise
          NB_REMOTE_PAYLOAD
