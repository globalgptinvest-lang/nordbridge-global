name: NordBridge bounded public research activation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-operations.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess,time
          from pathlib import Path
          import yaml
          FILES={'director.py': '', 'tick.py': '', 'research.py': ''}
          TESTS={'research.py': '', 'monitor.py': '', 'test_research.py': '', 'test_backup_monitor.py': ''}
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          os.umask(0o077);root=Path('/opt/nordbridge-director')
          dest=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('public-research-%Y%m%dT%H%M%SZ');dest.mkdir(mode=0o700)
          tests=dest/'tests';tests.mkdir(mode=0o755);os.chmod(dest,0o755);tests.chmod(0o755)
          for name,data in TESTS.items():
           (tests/name).write_bytes(base64.b64decode(data));(tests/name).chmod(0o644)
          run(['docker','run','--rm','--network','none','--read-only','--tmpfs','/tmp:rw,size=64m,mode=1777','--memory','256m','--cpus','1','--user','65534:65534','-v',str(tests)+':/tests:ro','nordbridge-office-core','python3','-m','unittest','discover','-s','/tests','-p','test_*.py','-q'])
          print('ISOLATED_RESEARCH_TESTS=PASS count=19',flush=True)
          dest.chmod(0o700)
          # Verify a fresh backup before changing source, Compose or the schema.
          run(['python3',str(root/'maintenance.py')],timeout=1800)
          for name,data in FILES.items():
           if (root/name).exists():shutil.copy2(root/name,dest/name)
           source=base64.b64decode(data).decode();compile(source,name,'exec')
           (root/name).write_text(source);(root/name).chmod(0o644)
          compose=root/'compose.yaml';shutil.copy2(compose,dest/'compose.yaml')
          cfg=yaml.safe_load(compose.read_text());volumes=cfg['services']['director'].setdefault('volumes',[])
          if './research.py:/app/research.py:ro' not in volumes:volumes.append('./research.py:/app/research.py:ro')
          compose.write_text(yaml.safe_dump(cfg,sort_keys=False));compose.chmod(0o600)
          dc=['docker','compose','-p','nordbridge-director','-f',str(compose)]
          run(dc+['config','--quiet'])
          # Avoid interrupting an owner task. Source bind mounts refresh only after recreation.
          for i in range(20):
           n=int(run(['docker','exec','nordbridge-director-director-1','python3','-c',"import director as d; c=d.db();print(c.execute(\"SELECT count(*) n FROM director.jobs WHERE status IN ('RUNNING','WAITING')\").fetchone()['n']);c.close()" ]))
           if n==0:break
           time.sleep(3)
          else:raise RuntimeError('active_tasks_deployment_postponed')
          run(dc+['up','-d','--no-build','--force-recreate']);time.sleep(5)
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'monitor':json.loads(run(['python3',str(root/'monitor.py')]))}
          code=r'''
          import director as d,json,time
          from research import scan
          roles=['leads','contractors','financing']
          for attempt in range(90):
           with d.db() as c:
            rows=c.execute("SELECT DISTINCT ON(role) id,role,stream,status,error,result FROM director.jobs WHERE role=ANY(%s) AND fingerprint LIKE 'SCHEDULE-%%' ORDER BY role,created_at DESC",(roles,)).fetchall()
           if len(rows)==3 and all(x['status'] not in ('QUEUED','RUNNING','WAITING') for x in rows):break
           time.sleep(2)
          out={'scheduled_jobs':rows,'repeat_scans':[]}
          for role in roles:
           stream='FINANCING' if role=='financing' else 'NORDBRIDGE'
           out['repeat_scans'].append(scan({'role':role,'stream':stream}))
          out['zhikal_gate']=scan({'role':'leads','stream':'ZHIKAL'})
          with d.db() as c:
           out['entities']={t:c.execute(f'SELECT stream,count(*) n FROM director.{t} GROUP BY stream ORDER BY stream').fetchall() for t in ['leads','contractors','opportunities']}
           out['samples']={t:c.execute(f"SELECT stream,source,stage,data->'source_evidence'->>'title' title,data->'source_evidence'->>'name' name FROM director.{t} WHERE fingerprint LIKE 'RESEARCH-%%' ORDER BY created_at DESC LIMIT 3").fetchall() for t in ['leads','contractors','opportunities']}
           out['research_cache_keys']=c.execute('SELECT key FROM director.research_cache ORDER BY key').fetchall()
          print(json.dumps(out,default=str))
          '''
          out['research']=json.loads(run(['docker','exec','-i','nordbridge-director-director-1','python3','-'],code,300))
          out['second_tick']=json.loads(run(['python3',str(root/'monitor.py')]))
          (dest/'result.json').write_text(json.dumps(out,indent=2))
          print('PUBLIC_RESEARCH_RESULT='+json.dumps(out))
          NB_REMOTE_PAYLOAD
