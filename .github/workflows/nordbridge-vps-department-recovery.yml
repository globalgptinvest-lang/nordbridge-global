name: NordBridge bounded AI recovery and evidence based department drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nordbridge-vps-department-recovery.yml'
permissions:
  contents: read
concurrency:
  group: nordbridge-vps-department-recovery
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorized NordBridge operation with sanitized output
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::BLOCKED: configure VPS_SSH_PRIVATE_KEY and verified VPS_KNOWN_HOSTS in Actions secrets; install the matching public key for workagent."
            echo "VPS_SSH_ACCESS=BLOCKED_MISSING_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1; then
            echo "::error::BLOCKED: private key is invalid or requires an interactive passphrase."
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::BLOCKED: known_hosts is invalid; verify the host key through the VPS console."
            exit 1
          fi
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p 22 workagent@57.129.182.200 'sudo -n python3 -' <<'NB_REMOTE_PAYLOAD'
          import base64,datetime,json,os,shutil,subprocess,time
          from pathlib import Path
          FILES={'director.py': '', 'monitor.py': ''}
          PRODUCT={'kind': 'product_research', 'name': 'Tender readiness and independent bid review — internal proposal', 'checked_at': '2026-10-25', 'status': 'DRAFT_OWNER_REVIEW', 'target_customer': 'SME with an existing draft tender response and a verified official deadline; no paid client identified by this research', 'demand_evidence': 'Five providers offer bid review or bid writing support; supplier offerings indicate a service category, not independently measured buyer demand.', 'sources': [{'provider': 'Glaxtons', 'url': 'https://www.glaxtons.co.uk/pricing/', 'service': 'Bid Review', 'currency': 'GBP', 'public_price': 950, 'vat': 'not confirmed in captured pricing excerpt'}, {'provider': 'Bidsmithery', 'url': 'https://bidsmithery.com/services/bid-review/', 'service': 'Contract Bid Review', 'currency': 'GBP', 'public_price': 1995, 'vat': 'excluded', 'scope_note': 'Includes initial structure and optional final review; broader than some single review offers'}, {'provider': 'BidReview.ai', 'url': 'https://bidreview.ai/pricing/', 'service': 'AI Audit per bid', 'currency': 'EUR', 'public_price': 499, 'vat': 'excluded', 'scope_note': 'AI audit, not directly comparable to human consultant review; older conflicting URL excluded'}, {'provider': 'Executive Compass', 'url': 'https://www.executivecompass.co.uk/services/bid-review/', 'service': 'Independent bid review', 'public_price': None, 'scope_note': 'No verified public fixed amount captured; exclude from averages'}, {'provider': 'Tenders UK', 'url': 'https://www.tenders-uk.com/knowledge-hub/bid-writing-services-what-to-expect-and-pay/', 'service': 'Full bid writing projects', 'currency': 'GBP', 'historical_project_average_2025': 8700, 'scope_note': 'Different service and historical provider average; excluded from review comparison'}], 'price_analysis': {'nominal_review_offer_sample_mean_gbp': 1472.5, 'sample_size': 2, 'calculation': '(950+1995)/2', 'market_average': 'NOT ESTIMATED', 'limitations': 'Small nonrepresentative sample; different scope and unaligned VAT. No EUR/GBP conversion. This is not a NordBridge selling price.'}, 'deliverables_draft': ['Requirements and eligibility matrix', 'Evidence/document gap list', 'Scoring criteria checklist', 'Prioritized readiness report', 'Human quality review before client delivery'], 'sales_funnel_draft': ['Verified live tender and explicit buyer need', 'Eligibility and scope screening', 'Owner-approved scope and unchanged commercial terms', 'Draft personalized offer containing NordBridge website', 'Allowed communication and reply tracking', 'Owner-approved agreement and verified prepayment'], 'risks_to_review': ['Confidential bid data and data-processing permission', 'Accuracy of eligibility/deadline interpretation', 'No bid-win guarantee', 'Human professional review and capacity before commitments', 'Financing/intermediation activity requires separate legal review'], 'operating_cost_model': 'NOT VERIFIED — actual human review time and delivery costs must be measured before margin or price approval', 'nordbridge_price': None, 'published': False, 'payments_created': False, 'external_sent': 0, 'next_action': 'Validate comparable scopes/VAT and delivery costs; prepare owner review. Do not activate prices or products.'}
          def run(args,stdin=None,timeout=120):
           p=subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=timeout)
           if p.returncode:raise RuntimeError('command_failed:'+args[0]+':'+str(p.returncode))
           return p.stdout
          os.umask(0o077);root=Path('/opt/nordbridge-director')
          backup=Path('/var/backups/nordbridge-director')/datetime.datetime.now(datetime.timezone.utc).strftime('department-fix-%Y%m%dT%H%M%SZ');backup.mkdir(mode=0o700)
          for name,content in FILES.items():
           shutil.copy2(root/name,backup/name)
           (root/name).write_bytes(base64.b64decode(content));(root/name).chmod(0o644)
          # Respect a running job before refreshing the Director process.
          for i in range(15):
           n=int(run(['docker','exec','nordbridge-director-director-1','python3','-c',"import director as d; c=d.db(); print(c.execute(\"SELECT count(*) n FROM director.jobs WHERE status='RUNNING'\").fetchone()['n']);c.close()" ]))
           if n==0:break
           time.sleep(2)
          else:raise RuntimeError('active_job_deploy_postponed')
          run(['docker','compose','-p','nordbridge-director','-f',str(root/'compose.yaml'),'up','-d','--no-build','--force-recreate']);time.sleep(5)
          store=r'''
          import director as d,json,sys,uuid
          from psycopg.types.json import Jsonb
          product=json.load(sys.stdin)
          with d.db() as c:
           r=c.execute("""INSERT INTO director.proposals(id,stream,fingerprint,source,stage,next_action,data)
             VALUES(%s,'NORDBRIDGE','PRODUCT-RESEARCH-BID-REVIEW-20261025','Public competitor websites checked 2026-10-25','DRAFT_OWNER_REVIEW','Validate scope, VAT, delivery costs and owner approval; do not publish prices',%s)
             ON CONFLICT(stream,fingerprint) DO UPDATE SET data=EXCLUDED.data,updated_at=now() RETURNING id""",(uuid.uuid4(),Jsonb(product))).fetchone()
           print(json.dumps({'saved':True,'proposal_id':str(r['id'])}))
          '''
          out={'product_saved':json.loads(run(['docker','exec','-i','nordbridge-director-director-1','python3','-c',store],json.dumps(PRODUCT)))}
          out['monitor']=json.loads(run(['python3',str(root/'monitor.py')]))
          test=r'''
          import director as d,json,time,uuid
          ids=[]
          for role in ['legal','marketing','communications','products']:
           t=d.Task(role=role,stream='NORDBRIDGE' if role=='products' else 'TEST',task='INTERNAL TEST: report the factual scope and required next action in 2 short sentences. Do not invent prices, law, clients or payments. Include https://nordbridge-global.com. Never send externally. Preserve BoVendia and Zynthoro holds.',fingerprint='ROLETEST-'+role+'-retry-'+str(uuid.uuid4()))
           ids.append(d.enqueue(t)['id'])
          for i in range(75):
           with d.db() as c:r=c.execute('SELECT role,status,error FROM director.jobs WHERE id=ANY(%s::uuid[])',(ids,)).fetchall()
           if all(x['status'] not in ('QUEUED','RUNNING') for x in r):break
           time.sleep(4)
          with d.db() as c:
           latest=c.execute("SELECT DISTINCT ON(role) role,status,error,result,updated_at FROM director.jobs WHERE fingerprint LIKE 'ROLETEST-%' ORDER BY role,created_at DESC").fetchall()
           out=[]
           for row in latest:
            value=row['result'] or {};ai=value.get('draft') or value.get('plan') or {}
            out.append({'role':row['role'],'status':row['status'],'error':row['error'],'updated_at':str(row['updated_at']),'scope':value.get('scope'),'reason':value.get('reason'),'draft_nonempty':bool(ai.get('draft')),'model':ai.get('model'),'output_tokens':ai.get('output_tokens'),'approval_required':value.get('approval_required'),'external_sent':value.get('external_sent',0)})
           print(json.dumps(out))
          '''
          out['roles']=json.loads(run(['docker','exec','-i','nordbridge-director-director-1','python3','-'],test,330))
          out['time_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          Path('/var/backups/nordbridge-director/completed-departments.json').write_text(json.dumps(out,indent=2))
          print('COMPLETED_DEPARTMENTS='+json.dumps(out))
          NB_REMOTE_PAYLOAD
