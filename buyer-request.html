<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit Procurement Requirement | NordBridge</title><meta name="description" content="Submit a procurement requirement for contractor and supplier sourcing by NordBridge."><link rel="stylesheet" href="style.css"></head><body><section><div class="container"><div class="section-head"><div class="section-kicker">Buyer Request</div><h1>Find a contractor or supplier</h1></div><form class="lead-form" data-mail-subject="Buyer procurement requirement"><label>Organization<input name="Organization" required></label><label>Country<input name="Country" required></label><label>Email<input name="Email" type="email" required></label><label>What do you need?<textarea name="Requirement" required></textarea></label><label>Delivery / project location<input name="Project location"></label><label>Target date / deadline<input name="Deadline"></label><label>Estimated value (optional)<input name="Estimated value"></label><button class="btn primary" type="submit">Send Requirement</button></form></div></section><script src="forms.js"></script><script src="i18n.js"></script></body></html>
